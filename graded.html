<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Data-3 STEP conversions — every graded model</title>
<style>
.viz-root{color-scheme:light;
  --page:#f9f9f7;--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--series-1:#2a78d6;--track:#e1e0d9;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;--good-text:#006300}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;
  --page:#0d0d0d;--surface-1:#1a1a19;--text-primary:#fff;--text-secondary:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--series-1:#3987e5;--track:#2c2c2a;--good-text:#0ca30c}}
:root[data-theme="dark"] .viz-root{color-scheme:dark;--page:#0d0d0d;--surface-1:#1a1a19;--text-primary:#fff;
  --text-secondary:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--series-1:#3987e5;--track:#2c2c2a;--good-text:#0ca30c}
*{box-sizing:border-box}
body{margin:0}
.viz-root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--text-primary);min-height:100vh;padding:28px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;margin:0;font-weight:650}
.sub{color:var(--text-secondary);font-size:14px;margin:0 0 22px}
.live{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.stale{background:var(--warning)}
a{color:var(--series-1)}
section{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:0 0 18px}
h2{font-size:17px;margin:0 0 4px;font-weight:650}
.note{color:var(--text-secondary);font-size:13px;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 16px}
.tile{border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--text-secondary)}
.tile .v{font-size:24px;font-weight:650;margin-top:2px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.meter{margin:8px 0 12px}
.meter .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--text-secondary)}
.meter .row b{color:var(--text-primary);font-weight:600}
.track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--series-1);border-radius:5px 4px 4px 5px;min-width:2px;transition:width .6s}
.status{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 12px}
.status span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid)}
th{color:var(--text-secondary);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.ok{color:var(--good-text)} .muted{color:var(--muted)}
.gh{font-size:13px;margin:10px 0 4px;color:var(--text-secondary);font-weight:600}
.stage{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.ic{width:18px;text-align:center;font-weight:700}
footer{color:var(--muted);font-size:12px;margin-top:20px}
.scroll{overflow-x:auto}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.filters select,.filters input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--text-primary)}
.filters input{min-width:280px;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;background:transparent;color:var(--text-primary);font:inherit;font-size:13px;text-align:left}
.chip b{font-size:18px;display:block}
.chip.on{outline:2px solid var(--series-1)}
.cls{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
td{vertical-align:top}
td ul{margin:0;padding-left:16px} td li{margin:0 0 2px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:4px;color:var(--text-secondary);white-space:nowrap}
.small{font-size:12px}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.pager button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--text-primary);cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.name{font-weight:600;word-break:break-word}
</style>
</head>
<body>
<div class="viz-root"><div class="wrap">
<header><h1>Zenitude-data-3 → STEP: every graded model</h1><span class="live"><span class="dot" id="dot"></span><span id="age">loading…</span></span></header>
<p class="sub">One row per distinct model (IFC, Tekla DB1, SDS2 job): its STEP class, <b>why</b> it got that class, and <b>what would be needed</b> to make it a perfect STEP. <a href="sources.html">← back to the live status</a></p>
<section>
  <p class="note" id="legend"></p>
  <div class="chips" id="chips"></div>
  <div class="filters">
    <label class="small">Type <select id="f-type"><option value="">All</option><option value="ifc">IFC</option><option value="db1">Tekla DB1</option><option value="sds2">SDS2 job</option></select></label>
    <label class="small">Class <select id="f-class"><option value="">All</option><option value="1">1 — perfect</option><option value="2">2 — partial</option><option value="3">3 — bad</option></select></label>
    <label class="small">Origin <select id="f-reuse"><option value="">All</option><option value="new">Converted now</option><option value="reused">Reused (Disk-1/2, Z4)</option></select></label>
    <label class="small">Fix status <select id="f-fs"><option value="">All</option><option value="rerun">Fix live — re-run queued</option><option value="wip">Fix being written</option><option value="src">Not fixable from this file</option></select></label>
    <input id="f-q" type="search" placeholder="Search file name, folder, reason or fix…">
    <span class="muted small" id="count"></span>
  </div>
  <div class="scroll"><table id="t"></table></div>
  <div class="pager"><button id="prev">← Prev</button><span id="page"></span><button id="next">Next →</button></div>
</section>
<footer id="foot"></footer>
</div></div>
<script>
const SRC=["z3conv.json","https://raw.githubusercontent.com/dhigdec/cad-extract-status/main/z3conv.json"];
const nf=new Intl.NumberFormat("en-US"), n=x=>x==null?"–":nf.format(Math.round(x));
const gb=x=>x==null?"–":(x>=1e9?(x/1e9).toFixed(2)+" GB":(x/1e6).toFixed(1)+" MB");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE={ifc:"IFC",db1:"Tekla DB1",sds2:"SDS2 job"};
const CLS={1:["✓","Perfect","var(--good)"],2:["!","Partial","var(--warning)"],3:["✕","Bad","var(--critical)"]};
const CAT={converter_feature:"fixable in our converter",source_file_missing:"file missing from the source",source_data_absent:"not in the source data",profile_or_catalog_missing:"profile / catalog entry missing",source_damaged:"source damaged"};
const FS={rerun:["Fix live — re-run queued","Made with an older converter (or reused). It will be re-converted with the latest fixes and graded again.","var(--series-1)"],wip:["Fix being written","Made with the latest converter; the fix for what is still missing is being written and will re-run this model.","var(--warning)"],src:["Not fixable from this file","What is missing is not in the source file, so no converter change can add it without inventing geometry.","var(--muted)"]};
const VV={PASS:["Verified","var(--good)"],WARN:["Verified, with notes","var(--good)"],FAIL:["Verifier found problems","var(--critical)"],CANNOT_VERIFY:["Could not verify","var(--muted)"],ERROR:["Verifier error","var(--muted)"]};
const EV={external_truth:"checked against the authoring tool's own export (IFC / BOM / NC)",independent_decode:"independent decode of the source",element_match:"element-by-element match to the source",integrity:"file integrity only"};
function vvb(r){if(!r.vv)return r.vp?"<span class='muted small'>class 1 pending verification</span>":"<span class='muted small'>not yet verified</span>";const b=VV[r.vv]||[r.vv,"var(--muted)"];
  return `<span class="cls small"><span class="sw" style="background:${b[1]}"></span>${esc(b[0])}</span>${r.ve?`<div class="muted small">${esc(EV[r.ve]||r.ve)}</div>`:""}${(r.vc||[]).length?`<div class="muted small">${r.vc.map(esc).join(", ")}</div>`:""}${r.vm?`<div class="muted small">${n(r.vm)} missing per verifier</div>`:""}`}
const ST={rerun:"re-run queued",wip:"fix in progress",src:"not in source"};
function fsb(f){const b=FS[f];return b?`<span class="cls small" title="${esc(b[1])}"><span class="sw" style="background:${b[2]}"></span>${b[0]}</span><div class="muted small">${esc(b[1])}</div>`:"<span class='muted small'>–</span>"}
const PER=50; let ROWS=[], VIEW=[], page=0, GEN="";
function badge(c){const b=CLS[c]||["?","–","var(--muted)"];return `<span class="cls"><span class="sw" style="background:${b[2]}"></span>${b[0]} ${c||""} ${b[1]}</span>`}
function filt(){const t=$("f-type").value,c=$("f-class").value,o=$("f-reuse").value,fs=$("f-fs").value,q=$("f-q").value.trim().toLowerCase();
  VIEW=ROWS.filter(r=>(!t||r.p===t)&&(!c||String(r.c)===c)&&(!o||(o==="reused")===!!r.r)&&(!fs||r.fs===fs)&&(!q||r._s.includes(q)));page=0;draw()}
function $(id){return document.getElementById(id)}
function draw(){const pages=Math.max(1,Math.ceil(VIEW.length/PER)); page=Math.min(page,pages-1);
  $("count").textContent=`${n(VIEW.length)} of ${n(ROWS.length)} models`;
  $("page").textContent=`page ${page+1} / ${pages}`; $("prev").disabled=page<=0; $("next").disabled=page>=pages-1;
  const rows=VIEW.slice(page*PER,(page+1)*PER);
  $("t").innerHTML=`<tr><th>#</th><th>Model file</th><th>Type</th><th>Class</th><th>Why it got this class</th><th>What is needed for a perfect STEP</th><th>Fix status</th><th>Independent verification</th><th class="n">Parts source → STEP</th><th class="n">STEP size</th></tr>`+
    (rows.length?rows.map((r,i)=>`<tr><td class="muted small">${page*PER+i+1}</td>
      <td><div class="name">${esc(r.n)}</div><div class="muted small">${esc(r.f)}${r.np>1?` · ${n(r.np)} copies`:""}${r.r?` · reused STEP from ${esc(r.rf||"earlier run")}`:" · converted now"}</div></td>
      <td class="small">${TYPE[r.p]||esc(r.p)}${r.v?`<div class="muted">${esc(r.v)}</div>`:""}</td>
      <td>${badge(r.c)}${r.k?`<div class="muted small">corpus ${esc(r.k)}</div>`:""}</td>
      <td class="small"><ul>${(r.why||[]).map(w=>`<li>${esc(w)}</li>`).join("")||"<li class='muted'>–</li>"}</ul></td>
      <td class="small">${(r.need||[]).length?`<ul>${r.need.map(x=>`<li>${esc(x.fix)}<span class="tag">${esc(CAT[x.cat]||x.cat)}</span>${x.st?`<span class="tag">${esc(ST[x.st]||x.st)}</span>`:""}</li>`).join("")}</ul>`:(r.c===1?"<span class='muted'>nothing — already perfect</span>":"<span class='muted'>–</span>")}</td>
      <td>${r.c===1?"<span class='muted small'>–</span>":fsb(r.fs)}</td>
      <td>${vvb(r)}</td>
      <td class="n small">${n(r.ps)} → ${n(r.pt)}${r.inv?`<div class="muted">${n(r.inv)} invalid solids</div>`:""}</td>
      <td class="n small">${gb(r.sz)}</td></tr>`).join(""):`<tr><td colspan="10" class="muted">No models match these filters.</td></tr>`)}
function chips(){const c={1:0,2:0,3:0};ROWS.forEach(r=>{c[r.c]=(c[r.c]||0)+1});const cur=$("f-class").value;
  $("chips").innerHTML=[["","All graded",ROWS.length]].concat([1,2,3].map(k=>[String(k),`${CLS[k][0]} Class ${k} — ${CLS[k][1]}`,c[k]||0])).map(([v,l,x])=>`<button class="chip${cur===v?" on":""}" data-v="${v}">${l}<b>${n(x)}</b></button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("f-class").value=b.dataset.v;chips();filt()})}
async function load(){let d=null;for(const u of SRC){try{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(r.ok){d=await r.json();break}}catch(e){}}
  if(!d){$("age").textContent="could not load z3conv.json";$("dot").classList.add("stale");return}
  if(d.generated_at===GEN)return; GEN=d.generated_at;
  ROWS=(d.rows||[]).map(r=>Object.assign(r,{_s:[r.n,r.f,r.v,(r.why||[]).join(" "),(r.need||[]).map(x=>x.fix).join(" ")].join(" ").toLowerCase()}));
  const age=(Date.now()-Date.parse(d.generated_at))/60000; $("age").textContent=`updated ${d.generated_at.replace("T"," ").replace("Z"," UTC")}`; $("dot").classList.toggle("stale",age>15);
  $("legend").innerHTML=`${d.interim?"<b>Interim grades</b> — conversions are still running; one final grading pass over the finished STEP files produces the final classes. ":""}`+
    `<b>Class 1 perfect</b>: opens, every physical part of the source present, all solids valid, no stand-ins, part volumes within 5%. `+
    `<b>Class 2 partial</b>: opens, but parts missing / approximated (each one tagged) or a file or definition is needed. `+
    `<b>Class 3 bad</b>: no usable STEP — conversion failed, no geometry, or damaged / empty source. Nothing is fabricated: derived or estimated parts are tagged and never count as perfect. `+
    `<b>Independent verification</b>: every STEP is also checked by a separate verifier for its format (IFC element match, Tekla export match, SDS2 independent decode + SDS2's own IFC / BOM / NC files). A model is class 1 only when both the grader and the verifier pass it. `+
    `<b>Fix status</b> (class 2/3): <i>fix live — re-run queued</i> = this STEP was made before the latest converter fixes and will be re-converted; <i>fix being written</i> = made with the latest converter, the remaining gap is still being fixed; <i>not fixable from this file</i> = the missing data is not in the source.`;
  chips(); filt(); $("foot").textContent=`z3conv.json generated ${d.generated_at} · ${n(ROWS.length)} models`}
["f-type","f-class","f-reuse","f-fs"].forEach(id=>$(id).onchange=()=>{chips();filt()}); $("f-q").oninput=filt;
$("prev").onclick=()=>{page--;draw()}; $("next").onclick=()=>{page++;draw()};
load(); setInterval(load,60000);
</script>
</body>
</html>
