        <div class="data-heading"><div><h3>Exact measured nesting depth</h3></div>
          <p>Finished archives only · exact depths 0–15</p></div>
        <div class="depth-summary">
          <div><span>Finished measured</span><strong>${missing(measured, formatCount)}</strong></div>
          <div><span>Unopened / unmeasured</span><strong>${missing(unopened, formatCount)}</strong></div>
          <div><span>Max measured depth</span><strong>${missing(maximum, formatCount)}</strong></div>
          <div><span>Depth-cap hits</span><strong>${missing(capHits, formatCount)}</strong></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Exact measured depth</th><th>Finished archive maximum</th><th>Archive nodes opened</th><th>Distribution</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p class="caption">Unopened archives have no measured nesting depth and are not included. The configured safety cap is
          ${number(cap) === null ? '<span class="missing">pending</span>' : formatCount(cap)}; a depth-cap hit is not inferred from a bucket count.</p>
      </section>`;
    }

    function backlogSection(bundle) {
      const supplied = bundle.backlogArrays.length > 0;
      const rows = supplied ? bundle.backlogArrays[0] : [];
      let content;
      if (!supplied) {
        content = `<div class="empty-state">Size-bucket backlog is not available in the current status schema.</div>`;
      } else if (!rows.length) {
        content = `<div class="empty-state">No remaining size-bucket rows were reported.</div>`;
      } else {
        const body = rows.map(row => {
          const label = aliasValue(row, ["label", "bucket", "range", "size_bucket", "name"]);
          const remaining = aliasValue(row, ["remaining", "left", "count", "archives"]);
          const bytes = aliasValue(row, ["bytes", "source_bytes", "compressed_bytes", "remaining_bytes"]);
          const tb = aliasValue(row, ["tb", "source_tb", "terabytes"]);
          const sourceSize = number(bytes) !== null
            ? formatBytes(bytes)
            : number(tb) !== null ? `${formatDecimal(tb, 3)} TB` : '<span class="missing">pending</span>';
          return `<tr><td>${escapeHtml(label || "not available")}</td><td>${missing(remaining, formatCount)}</td>
            <td>${sourceSize}</td><td><span class="missing">not measured</span></td></tr>`;
        }).join("");
        content = `<div class="table-wrap"><table>
          <thead><tr><th>Archive size bucket</th><th>Remaining</th><th>Compressed source size</th><th>Exact depth</th></tr></thead>
          <tbody>${body}</tbody>
        </table></div>`;
      }
      return `<section class="data-section">
        <div class="data-heading"><div><h3>Remaining backlog by archive size</h3></div>
          <p>Unopened rows have no depth measurement</p></div>
        ${content}
      </section>`;
    }

    function scopeHasData(bundle) {
      return [
        archiveMetric(bundle, "total"),
        countValue(bundle, "pdf", "raw"),
        countValue(bundle, "2d", "raw"),
        depthMetric(bundle, ["measured_finished_archives"])
      ].some(value => number(value) !== null);
    }


    function dedupCoverage(bundle) {
      for (const root of bundle.roots) {
        const value = root && root.dedup_coverage;
        if (isObject(value)) return value;
      }
      return null;
    }

    function renderDedupCoverage(bundle) {
      const coverage = dedupCoverage(bundle);
      if (!coverage) {
        return `<div class="data-card"><div class="data-heading"><div><h3>Dedup coverage</h3></div><p>Awaiting reducer coverage block</p></div><p class="missing">pending</p></div>`;
      }
      const rows = [
        ["SHA-256 identities", coverage.sha256],
        ["Weak name+size", coverage.weak_name_size],
        ["Weak CAD/non-CAD PDF subtype", coverage.weak_pdf_subtype],
        ["Distinct block hashes", coverage.block_distinct_hashes],
        ["Duplicate block bytes", coverage.block_duplicate_bytes]
      ];
      const body = rows.map(([label, entry]) => {
        const status = entry && entry.status ? String(entry.status) : "pending";
        const covered = entry && number(entry.covered_archives);
        const completed = entry && number(entry.completed_archives);
        const reason = entry && entry.reason ? String(entry.reason) : "";
        let detail = status;
        if (covered !== null && completed !== null) {
          detail += ` · ${formatCount(covered)}/${formatCount(completed)} archives`;
        }
        if (reason) detail += ` · ${escapeHtml(reason)}`;
        const cls = status === "exact" ? "ok" : (status === "partial" ? "warn" : "missing");
        return `<tr><td>${escapeHtml(label)}</td><td class="${cls}">${detail}</td></tr>`;
      }).join("");
      return `<div class="data-card"><div class="data-heading"><div><h3>Dedup coverage</h3></div><p>Exact vs honestly partial/pending</p></div><table><thead><tr><th>Metric</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function renderScopePanel(status, definition) {
      const bundle = buildBundle(status, definition.id);
      const done = archiveMetric(bundle, "done");
      const remaining = archiveMetric(bundle, "remaining");
      const pdf = countValue(bundle, "pdf", "raw");
      const hasData = scopeHasData(bundle);
      const unavailableNote = hasData ? "" : `<div class="availability-note">
        Per-disk metrics are pending in the current status schema. Combined values are not split or inferred.
      </div>`;

      return `<section id="panel-${definition.id}" class="tab-panel" role="tabpanel"
        aria-labelledby="tab-${definition.id}" data-scope-panel="${definition.id}"
        ${definition.id === selectedScope ? "" : "hidden"}>
        <div class="scope-heading">
          <div class="scope-title-wrap"><span class="scope-mark" aria-hidden="true">${definition.short}</span>
            <div><h2>${definition.label}</h2><p>Truthful published counts; missing fields remain pending.</p></div></div>
          <span class="chip">${hasData ? "status fields available" : "awaiting segmented fields"}</span>
        </div>
        ${unavailableNote}
        <div class="scope-grid">
          <div class="scope-stat"><span>Archives done</span><strong>${missing(done, formatCount)}</strong></div>
          <div class="scope-stat"><span>Archives remaining</span><strong>${missing(remaining, formatCount)}</strong></div>
          <div class="scope-stat"><span>PDF observations</span><strong>${missing(pdf, formatCount)}</strong></div>
        </div>
        <section class="data-section">
          <div class="data-heading"><div><h3>Archive lifecycle</h3></div><p>Retries and skips are explicit only</p></div>
          ${archiveTable(bundle)}
        </section>
        <section class="data-section">
          <div class="data-heading"><div><h3>Extracted asset inventory</h3></div>
            <p>${(countValue(bundle, "2d", "weak") != null || countValue(bundle, "2d", "sha256") != null)
            ? "Raw totals include baseline + new EC2; weak/SHA are exact for the reconciliation baseline set"
            : "Raw totals; weak/SHA stay pending until baseline hash identities are published"}</p></div>
          ${assetTable(bundle)}
        </section>
        <section class="data-section">
          <div class="data-heading"><div><h3>Block-level deduplication</h3></div><p>1 MiB blocks when supplied</p></div>
          ${blockTable(bundle)}
        </section>
        <section class="data-section">
          <div class="data-heading"><div><h3>Transfer &amp; storage footprint</h3></div><p>Per-disk values only when published</p></div>
          ${transferTable(status, bundle)}
        </section>
        ${pdfSection(bundle)}
        ${depthSection(bundle)}
        ${backlogSection(bundle)}
      </section>
          ${renderDedupCoverage(bundle)}
`;
    }

    function renderDatasetTabs(status) {
      const tabs = SCOPE_DEFS.map(definition => `<button id="tab-${definition.id}" class="tab" type="button"
        role="tab" aria-controls="panel-${definition.id}" aria-selected="${definition.id === selectedScope}"
        tabindex="${definition.id === selectedScope ? 0 : -1}" data-scope-tab="${definition.id}">${definition.label}</button>`).join("");
      const panels = SCOPE_DEFS.map(definition => renderScopePanel(status, definition)).join("");
      return `<section id="main-content" class="panel" aria-labelledby="datasets-title">
        <div class="section-heading">
          <div><p class="eyebrow">Segmented inventory</p><h2 id="datasets-title">Disk-level extraction detail</h2>
            <p>Use the tabs to inspect Disk 1, Disk 2, or the byte-distinct combined view.</p></div>
        </div>
        <div class="tabs" role="tablist" aria-label="Dataset scope">${tabs}</div>
        ${panels}
      </section>`;
    }

    function throughputValues(status) {
      const roots = uniqueObjects([
        status.throughput, status.rates, status.performance,
        isObject(status.progress) ? status.progress.throughput : null
      ]);
      let archivesPerHour = metricFromRoots(roots, ["archives_per_hour", "archive_rate_per_hour", "archives_hour"]);
      let compressedGbPerHour = metricFromRoots(roots, [
        "compressed_gb_per_hour", "source_gb_per_hour", "source_archive_gb_per_hour", "download_gb_per_hour"
      ]);
      const uploadGbPerHour = metricFromRoots(roots, [
        "gcs_upload_gb_per_hour", "upload_gb_per_hour", "stored_gb_per_hour", "stored_extracted_gb_per_hour"
      ]);
      const bytesRemaining = metricFromRoots(roots, ["bytes_remaining", "compressed_bytes_remaining", "source_bytes_remaining"]);
      let etaSeconds = metricFromRoots(roots, ["eta_seconds", "remaining_seconds"]);
      const etaHours = metricFromRoots(roots, ["eta_hours_at_observed_archive_rate"]);
      if (number(etaSeconds) === null && number(etaHours) !== null) etaSeconds = number(etaHours) * 3600;
      const etaAt = metricFromRoots(roots, ["eta_at", "estimated_completion_at"]);
      const ordering = metricFromRoots(roots.concat([status]), ["ordering", "archive_order", "processing_order"]);
      let archiveSource = number(archivesPerHour) === null ? "unavailable" : "reported";
      let compressedSource = number(compressedGbPerHour) === null ? "unavailable" : "reported";

      const uptimeHours = number(pickPath(status, [["compute", "uptime_hours"]]));
      const combined = buildBundle(status, "combined");
      const doneOnGcp = number(archiveMetric(combined, "doneOnGcp"));
      const transferred = number(pickPath(status, [["aws_source", "bytes_transferred"]]));
      if (number(archivesPerHour) === null && uptimeHours > 0 && doneOnGcp !== null) {
        archivesPerHour = doneOnGcp / uptimeHours;
        archiveSource = "cumulative";
      }
      if (number(compressedGbPerHour) === null && uptimeHours > 0 && transferred !== null) {
        compressedGbPerHour = transferred / 1e9 / uptimeHours;
        compressedSource = "cumulative";
      }
      return {
        archivesPerHour, compressedGbPerHour, uploadGbPerHour, bytesRemaining,
        etaSeconds, etaAt, ordering, archiveSource, compressedSource,
        uploadSource: number(uploadGbPerHour) === null ? "unavailable" : "reported"
      };
    }

    function throughputCard(label, value, formatter, source) {
      return `<div class="throughput-card"><span>${label}</span>
        <strong>${number(value) === null ? '<span class="missing">not available</span>' : formatter(value)}</strong>
        <span class="metric-source">${source}</span></div>`;
    }

    function renderThroughput(status) {
      const rates = throughputValues(status);
      let eta = '<span class="missing">not available</span>';
      let etaSource = "withheld";
      if (number(rates.etaSeconds) !== null) {
        eta = formatDurationSeconds(rates.etaSeconds);
        etaSource = "reported";
      } else if (present(rates.etaAt)) {
        eta = formatTimestamp(rates.etaAt);
        etaSource = "reported";
      }
      const orderNote = present(rates.ordering)
        ? ` Reported processing order: ${escapeHtml(rates.ordering)}.`
        : "";
      return `<section class="panel" aria-labelledby="throughput-title">
        <div class="section-heading">
          <div><p class="eyebrow">Pace &amp; projection</p><h2 id="throughput-title">Throughput and ETA</h2>
            <p>Cumulative rates are derived only from matching GCP counters and VM uptime.</p></div>
        </div>
        <div class="throughput-grid">
          ${throughputCard("Archives / hour", rates.archivesPerHour, value => `${rateFormat.format(value)} /h`, rates.archiveSource)}
          ${throughputCard("Compressed GB / hour", rates.compressedGbPerHour, value => `${rateFormat.format(value)} GB/h`, rates.compressedSource)}
          ${throughputCard("GCS upload GB / hour", rates.uploadGbPerHour, value => `${rateFormat.format(value)} GB/h`, rates.uploadSource)}
          ${throughputCard("Bytes remaining", rates.bytesRemaining, formatBytes, number(rates.bytesRemaining) === null ? "unavailable" : "reported")}
          <div class="throughput-card"><span>ETA</span><strong>${eta}</strong><span class="metric-source">${etaSource}</span></div>
        </div>
        <div class="callout">No ETA is guessed from archive counts. Early or smallest-first processing can make cumulative averages optimistic.${orderNote}</div>
      </section>`;
    }

    function recentArrays(status) {
      const results = [];
      const errors = [];
      for (const value of [
        status.recent_results, status.latest_results, pickPath(status, [["results", "recent"]]),
        pickPath(status, [["archives", "recent_results"]])
      ]) {
        if (Array.isArray(value)) results.push(...value.filter(isObject));
      }
      for (const value of [
        status.recent_errors, status.recent_failures, status.retries,
        pickPath(status, [["errors", "recent"]]), pickPath(status, [["failures", "recent"]])
      ]) {
        if (Array.isArray(value)) errors.push(...value.filter(isObject));
      }
      return { results, errors };
    }

    function recentCard(row, forceError = false) {
      const rawArchive = aliasValue(row, [
        "archive_basename", "archive", "current_archive", "name", "key", "path", "result_object"
      ]);
      const name = basename(rawArchive);
      const disk = aliasValue(row, ["disk", "source_disk"]) || diskFromValue(rawArchive);
      const status = aliasValue(row, ["status", "state", "result"]) || (forceError ? "failure" : "finished");
      const finished = aliasValue(row, ["finished_at", "updated_at", "timestamp", "at"]);
      const error = safeError(aliasValue(row, ["error_summary", "error", "message", "reason"]));
      return `<article class="recent-card${forceError || error ? " error" : ""}">
        <div class="recent-meta">${escapeHtml(disk || "Disk not available")} · ${escapeHtml(status)}</div>
        <div class="archive-name">${escapeHtml(name || "Archive basename not available")}</div>
        <div class="recent-meta">${formatTimestamp(finished, "time not available")}</div>
        ${error ? `<p class="error-summary">${escapeHtml(error)}</p>` : ""}
      </article>`;
    }

    function renderRecent(status) {
      const { results, errors } = recentArrays(status);
      const cards = [];
      for (const row of results.slice(0, 6)) cards.push(recentCard(row, false));
      for (const row of errors.slice(0, 6)) cards.push(recentCard(row, true));

      const lastResult = pickPath(status, ["last_result", ["results", "last_result"]]);
      const proofObject = pickPath(status, ["proof_object", ["results", "proof_object"]]);
      if (!cards.length && (present(lastResult) || present(proofObject))) {
        cards.push(`<article class="recent-card">
          <div class="recent-meta">Latest published checkpoint · finished</div>
          <div class="archive-name">${escapeHtml(basename(lastResult) || "Result marker not available")}</div>
          <div class="recent-meta">Latest extracted object: ${escapeHtml(basename(proofObject) || "not available")} ·
            ${formatTimestamp(status.last_finished_at, "time not available")}</div>
        </article>`);
      }
      if (!cards.length) return "";
      return `<section class="panel" aria-labelledby="recent-title">
        <div class="section-heading">
          <div><p class="eyebrow">Latest outcomes</p><h2 id="recent-title">Recent results &amp; errors</h2>
            <p>Public entries are reduced to disk, basename, status and a sanitized one-line summary.</p></div>
        </div>
        <div class="recent-grid">${cards.join("")}</div>
      </section>`;
    }

    function renderCostCard(status) {
      const gce = isObject(status.gce) ? status.gce : {};
      const compute = isObject(status.compute) ? status.compute : {};
      const disk = isObject(status.persistent_disk) ? status.persistent_disk : {};
      const gcs = isObject(status.gcs) ? status.gcs : {};
      const aws = isObject(status.aws_source) ? status.aws_source : {};
      const costs = isObject(status.costs) ? status.costs : {};
      const costEstimate = isObject(status.cost_estimate) ? status.cost_estimate : {};
      const costHints = fleetCostEstimates(status);
      const storedBytes = aliasValue(gcs, ["stored_bytes", "bytes"]);
      const transferredBytes = aliasValue(aws, ["bytes_transferred", "transferred_bytes"]);
      const combined = costHints.accrued;
      const poolHourly = costHints.hourly;
      const entries = vmEntries(status);
      const vmRows = entries.map(([name, vm]) => {
        const c = isObject(vm.costs) ? vm.costs : {};
        return `<div class="kv"><span>${escapeHtml(aliasValue(vm, ["instance_name"]) || name)}</span><strong>${formatMoney(aliasValue(c, ["hourly_compute_disk_estimate_usd"]))}/hr · ${formatMoney(aliasValue(c, ["accrued_compute_disk_estimate_usd"]))}</strong></div>`;
      }).join("");
      return `
        <aside class="cost-card">
          <div class="cost-inner">
            <div class="cost-heading">
              <div>
                <p class="eyebrow">Cloud footprint</p>
                <h2>Running cost estimates</h2>
              </div>
            </div>
            <p class="cost-total">Combined accrued estimate <strong>${formatMoney(combined)}</strong></p>
            <div class="kv"><span>Pool compute+disk</span><strong>${formatMoney(poolHourly)} / hr <em>(estimate)</em></strong></div>
            <h3>EC2 compute</h3>
            <div class="kv">
              <span>VMs</span><strong>${escapeHtml(aliasValue(gce, ["instance_count"]) || entries.length || "n/a")}</strong>
              <span>Rate</span><strong>${formatMoney(aliasValue(compute, ["hourly_estimate_usd", "hourly_usd"]) ?? aliasValue(costEstimate, ["ec2_hourly_estimate_usd"]))} / hr</strong>
              <span>Accrued</span><strong>${formatMoney(aliasValue(compute, ["accrued_estimate_usd", "accrued_usd"]))}</strong>
              <span>Uptime</span><strong>${number(compute.uptime_hours ?? costEstimate.uptime_hours ?? costHints.uptimeHours) === null ? "pending" : `${formatDecimal(compute.uptime_hours ?? costEstimate.uptime_hours ?? costHints.uptimeHours)} hr`}</strong>
            </div>
            <h3>Per-VM compute+disk</h3>
            ${vmRows || "<em>Per-VM estimates pending</em>"}
            <h3>EBS gp3</h3>
            <div class="kv">
              <span>Type / size</span><strong>${escapeHtml(aliasValue(disk, ["type"]) || "gp3")} · ${number(aliasValue(disk, ["size_gb"])) === null ? "fleet volumes" : `${formatCount(disk.size_gb)} GB`}</strong>
              <span>Hourly</span><strong>${formatMoney(aliasValue(disk, ["hourly_estimate_usd"]) ?? aliasValue(costEstimate, ["gp3_hourly_estimate_usd"]))}</strong>
              <span>Accrued</span><strong>${formatMoney(aliasValue(disk, ["accrued_estimate_usd", "accrued_usd"]))}</strong>
            </div>
            <h3>GCS storage estimate</h3>
            <div class="kv">
              <span>Objects</span><strong>${formatCount(aliasValue(gcs, ["object_count", "objects"]))}</strong>
              <span>Stored</span><strong>${formatBytes(storedBytes)}</strong>
              <span>Monthly</span><strong>${formatMoney(aliasValue(gcs, ["estimated_monthly_usd", "monthly_estimate_usd"]))}</strong>
            </div>
            <h3>AWS egress estimate</h3>
            <div class="kv">
              <span>Transferred</span><strong>${formatBytes(transferredBytes)}</strong>
              <span>Rate</span><strong>${formatMoney(aliasValue(aws, ["egress_rate_usd_per_gb", "rate_usd_per_gb"]))} / GB</strong>
              <span>Estimate</span><strong>${formatMoney(aliasValue(aws, ["running_egress_estimate_usd", "egress_estimate_usd"]))}</strong>
            </div>
            <p class="estimate-note">${escapeHtml(aliasValue(costs, ["estimate_label", "label"]) || aliasValue(costEstimate, ["label"]) || "Estimates only — not a cloud invoice. Missing billing inputs remain pending.")}</p>
            <div class="poll-line">
              <span>Live feed</span>
              <span id="poll-state" class="poll-state">20s poll · ~20s publish</span>
            </div>
          </div>
        </aside>`;
    }

    function render(status) {
      app.innerHTML = `<div class="shell">
        ${renderHeader(status)}
        <div class="page-grid">
          <main class="main-column">
            ${renderWorkers(status)}
            ${renderDatasetTabs(status)}
            ${renderThroughput(status)}
            ${renderRecent(status)}
          </main>
          ${renderCostCard(status)}
        </div>
        <footer>Read-only public telemetry · Missing values are shown as pending or not available · Source paths and archive identities are redacted</footer>
      </div>`;
      applySelectedScope(false);
      updateLiveIndicators();
    }

    function renderInitialError(error) {
      app.innerHTML = `<div class="shell"><div class="loading"><div class="loading-box">
        <strong>Status is temporarily unavailable</strong>
        <div>${escapeHtml(error.message || error)}. Retrying every 5 seconds.</div>
      </div></div></div>`;
    }

    function applySelectedScope(shouldFocus) {
      document.querySelectorAll("[data-scope-tab]").forEach(tab => {
        const active = tab.dataset.scopeTab === selectedScope;
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
        if (active && shouldFocus) tab.focus();
      });
      document.querySelectorAll("[data-scope-panel]").forEach(panel => {
        panel.hidden = panel.dataset.scopePanel !== selectedScope;
      });
    }

    function setPollState() {
      const element = document.getElementById("poll-state");
      if (!element) return;
      if (pollError) {
        element.textContent = "Retrying";
        element.classList.add("retrying");
        element.classList.remove("fallback");
        element.title = pollError.message || String(pollError);
      } else {
        element.textContent = lastFetchAt
          ? `${statusSourceLabel()} · checked ${ageTextFromSeconds((Date.now() - lastFetchAt) / 1000)} ago`
          : statusSourceLabel();
        element.classList.remove("retrying");
        element.classList.toggle("fallback", statusSource === "fallback");
        element.removeAttribute("title");
      }
    }

    function updateLiveIndicators() {
      if (!latestStatus) return;
      const health = healthInfo(latestStatus);
      const badge = document.getElementById("status-badge");
      const age = document.getElementById("heartbeat-age");
      if (badge) {
        badge.className = `status-badge ${health.key}`;
        badge.textContent = health.label;
      }
      if (age) age.textContent = `${ageTextFromSeconds(health.age)} ago`;
      setPollState();
    }

    app.addEventListener("click", event => {
      const tab = event.target.closest("[data-scope-tab]");
      if (!tab) return;
      selectedScope = tab.dataset.scopeTab;
      applySelectedScope(false);
    });

    app.addEventListener("keydown", event => {
      const tab = event.target.closest("[data-scope-tab]");
      if (!tab || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const currentIndex = SCOPE_DEFS.findIndex(scope => scope.id === tab.dataset.scopeTab);
      let nextIndex = currentIndex;
      if (event.key === "ArrowLeft") nextIndex = (currentIndex - 1 + SCOPE_DEFS.length) % SCOPE_DEFS.length;
      if (event.key === "ArrowRight") nextIndex = (currentIndex + 1) % SCOPE_DEFS.length;
      if (event.key === "Home") nextIndex = 0;
      if (event.key === "End") nextIndex = SCOPE_DEFS.length - 1;
      selectedScope = SCOPE_DEFS[nextIndex].id;
      applySelectedScope(true);
    });

    async function fetchStatus(url) {
      const separator = url.includes("?") ? "&" : "?";
      const response = await fetch(`${url}${separator}t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function tick() {
      try {
        let status;
        let source;
        // Prefer publisher-owned status-full.json (workers race-overwrite status.json).
        const isStructurallyRich = (doc) => !!(doc && doc.disks && doc.disks["Disk-1"] && doc.disks["Disk-1"].counts
          && doc.disks["Disk-2"] && doc.disks["Disk-2"].counts
          && doc.disks.combined && doc.disks.combined.counts);

        try {
          try {
            status = await fetchStatus(LIVE_STATUS_FULL_URL);
            source = "aws-s3-full";
          } catch (_fullErr) {
            status = await fetchStatus(LIVE_STATUS_URL);
            source = "aws-s3";
          }
          if (!isStructurallyRich(status) || !statusHasIdentityMetrics(status)) {
            try {
              const sticky = await fetchStatus(FALLBACK_GITHUB_STATUS_URL);
              if (statusHasIdentityMetrics(sticky)) {
                status = mergeIdentityCounts(status, sticky);
                source = source + "+github-identity";
              } else if (!isStructurallyRich(status)) {
                throw new Error("live status.json thin/missing per-disk counts");
              }
            } catch (stickyError) {
              if (!isStructurallyRich(status)) throw stickyError;
            }
          }
        } catch (primaryError) {
          try {
            status = await fetchStatus(FALLBACK_GITHUB_STATUS_URL);
            source = "github-fallback";
            if (!isStructurallyRich(status)) throw new Error("github status missing per-disk counts");
          } catch (githubError) {
            try {
              status = await fetchStatus(FALLBACK_GCS_STATUS_URL);
              source = "gcs-fallback";
            } catch (gcsError) {
              throw new Error(`AWS/GitHub/GCS status failed (${primaryError.message}; ${githubError.message}; ${gcsError.message})`);
            }
          }
        }
        const payload = `${source}:${JSON.stringify(status)}`;
        status = normalizeStatus(status);
        latestStatus = status;
        statusSource = source;
        lastFetchAt = Date.now();
        pollError = null;
        if (payload !== lastPayload) {
          lastPayload = payload;
          render(status);
        } else {
          updateLiveIndicators();
        }
      } catch (error) {
        pollError = error;
        if (!latestStatus) renderInitialError(error);
        setPollState();
      }
    }

    tick();
    setInterval(tick, POLL_MS);
    setInterval(updateLiveIndicators, 1000);
  </script>
</body>
</html>
