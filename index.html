<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AWS CAD Extraction Status · Disk 1, Disk 2 &amp; Combined</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --bg-accent: #e7f0ff;
      --surface: rgba(255, 255, 255, .88);
      --surface-solid: #ffffff;
      --surface-soft: #f7f9fc;
      --surface-raised: #ffffff;
      --text: #142033;
      --text-soft: #526078;
      --text-faint: #758198;
      --border: #dce3ee;
      --border-strong: #cbd5e3;
      --brand: #2563eb;
      --brand-2: #0f8f83;
      --brand-soft: #e7efff;
      --good: #087f5b;
      --good-soft: #dff7ed;
      --warn: #a45c00;
      --warn-soft: #fff0cf;
      --danger: #be3046;
      --danger-soft: #ffe5ea;
      --shadow: 0 16px 45px rgba(34, 51, 84, .09);
      --shadow-soft: 0 7px 24px rgba(34, 51, 84, .07);
      --radius: 20px;
      --radius-sm: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #08111f;
        --bg-accent: #0d2038;
        --surface: rgba(16, 28, 45, .9);
        --surface-solid: #101c2d;
        --surface-soft: #0c1727;
        --surface-raised: #142238;
        --text: #e8eef8;
        --text-soft: #a9b6c9;
        --text-faint: #8391a6;
        --border: #263750;
        --border-strong: #344761;
        --brand: #78a7ff;
        --brand-2: #52d4c5;
        --brand-soft: #172d50;
        --good: #54d3a3;
        --good-soft: #123c33;
        --warn: #ffc86b;
        --warn-soft: #493516;
        --danger: #ff899a;
        --danger-soft: #4c202b;
        --shadow: 0 18px 50px rgba(0, 0, 0, .28);
        --shadow-soft: 0 8px 25px rgba(0, 0, 0, .2);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 9% -8%, var(--bg-accent), transparent 31rem),
        radial-gradient(circle at 86% 2%, color-mix(in srgb, var(--brand-2) 11%, transparent), transparent 26rem),
        var(--bg);
      color: var(--text);
      font: 15px/1.55 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: var(--brand); }
    .skip-link {
      position: fixed;
      z-index: 100;
      left: 1rem;
      top: -5rem;
      padding: .65rem 1rem;
      border-radius: .6rem;
      background: var(--surface-solid);
      box-shadow: var(--shadow);
    }
    .skip-link:focus { top: 1rem; }

    .shell {
      width: min(1540px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 54px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--surface-solid) 94%, var(--brand) 6%), var(--surface) 62%),
        var(--surface-solid);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 290px;
      height: 290px;
      right: -100px;
      top: -130px;
      border: 48px solid color-mix(in srgb, var(--brand) 7%, transparent);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-top, .section-heading, .cost-heading, .scope-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--brand);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      max-width: 850px;
      margin-bottom: 10px;
      font-size: clamp(1.75rem, 3.5vw, 3.15rem);
      line-height: 1.06;
      letter-spacing: -.04em;
    }
    h2 {
      margin-bottom: 4px;
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      line-height: 1.2;
      letter-spacing: -.025em;
    }
    h3 {
      margin-bottom: 3px;
      font-size: 1rem;
      letter-spacing: -.01em;
    }
    .lede {
      max-width: 800px;
      margin: 0;
      color: var(--text-soft);
      font-size: 1rem;
    }
    .status-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      min-width: 112px;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 850;
      letter-spacing: .08em;
    }
    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 17%, transparent);
    }
    .status-badge.alive { color: var(--good); background: var(--good-soft); }
    .status-badge.stalled { color: var(--danger); background: var(--danger-soft); }
    .status-badge.waiting { color: var(--warn); background: var(--warn-soft); }

    .freshness-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin: 22px 0 13px;
      color: var(--text-soft);
      font-size: .82rem;
    }
    .freshness-line strong { color: var(--text); font-weight: 720; }
    .freshness-line span { display: inline-flex; align-items: center; gap: 7px; }
    .freshness-line span::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border-strong);
    }
    .progress-track {
      position: relative;
      height: 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
    }
    .progress-track > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      box-shadow: 0 0 20px color-mix(in srgb, var(--brand) 35%, transparent);
      transition: width .45s ease;
    }
    .progress-caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 7px;
      color: var(--text-soft);
      font-size: .78rem;
    }
    .progress-caption strong { color: var(--text); }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
      margin-top: 21px;
    }
    .hero-stat {
      min-height: 82px;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--surface-solid) 83%, transparent);
    }
    .hero-stat span {
      display: block;
      color: var(--text-faint);
      font-size: .71rem;
      font-weight: 760;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .hero-stat strong {
      display: block;
      margin-top: 4px;
      font-size: 1.25rem;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .hero-stat small { color: var(--text-soft); }
    .infra-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }
    .chip, .metric-source {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-soft);
      font-size: .73rem;
      font-weight: 650;
    }

    .page-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 345px;
      align-items: start;
      gap: 20px;
      margin-top: 20px;
    }
    .main-column { min-width: 0; }
    .panel {
      margin-bottom: 18px;
      padding: clamp(18px, 3vw, 27px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }
    .section-heading { margin-bottom: 17px; }
    .section-heading p, .scope-heading p {
      margin: 4px 0 0;
      color: var(--text-soft);
      font-size: .86rem;
    }
    .section-kicker {
      flex: 0 0 auto;
      color: var(--text-faint);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .worker-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .worker-card {
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface-soft);
    }
    .worker-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .worker-id {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 780;
    }
    .worker-id::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 14%, transparent);
    }
    .worker-card.idle .worker-id::before { background: var(--text-faint); box-shadow: none; }
    .stage {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: .69rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .archive-name {
      min-height: 2.7em;
      margin-bottom: 11px;
      overflow-wrap: anywhere;
      font-family: var(--mono);
      font-size: .8rem;
      font-weight: 650;
    }
    .worker-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin: 0;
    }
    .worker-details div { min-width: 0; }
    .worker-details dt {
      color: var(--text-faint);
      font-size: .66rem;
      font-weight: 730;
      letter-spacing: .045em;
      text-transform: uppercase;
    }
    .worker-details dd {
      margin: 1px 0 0;
      overflow-wrap: anywhere;
      font-size: .79rem;
      font-variant-numeric: tabular-nums;
    }

    .tabs {
      position: sticky;
      z-index: 5;
      top: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: -7px -7px 18px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: color-mix(in srgb, var(--surface-solid) 90%, transparent);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
    }
    .tab {
      min-height: 46px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      font-weight: 760;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .tab:hover { background: var(--surface-soft); }
    .tab:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 32%, transparent); outline-offset: 2px; }
    .tab[aria-selected="true"] {
      border-color: color-mix(in srgb, var(--brand) 35%, var(--border));
      background: var(--brand-soft);
      color: var(--brand);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--brand) 10%, transparent);
    }
    .tab-panel[hidden] { display: none; }
    .scope-heading {
      align-items: center;
      margin-bottom: 15px;
      padding: 2px 2px 0;
    }
    .scope-mark {
      display: grid;
      width: 45px;
      height: 45px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-weight: 850;
      letter-spacing: -.04em;
    }
    .scope-title-wrap { display: flex; align-items: center; gap: 12px; }
    .scope-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 16px;
    }
    .scope-stat {
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
    }
    .scope-stat span {
      display: block;
      color: var(--text-faint);
      font-size: .68rem;
      font-weight: 740;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .scope-stat strong {
      display: block;
      margin-top: 2px;
      font-size: 1.04rem;
      font-variant-numeric: tabular-nums;
    }
    .availability-note, .callout, .empty-state {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
      color: var(--text-soft);
      font-size: .82rem;
    }
    .availability-note {
      margin-bottom: 15px;
      border-color: color-mix(in srgb, var(--warn) 35%, var(--border));
      background: var(--warn-soft);
      color: var(--warn);
    }

    .data-section {
      padding: 19px 0 4px;
      border-top: 1px solid var(--border);
    }
    .data-section:first-of-type { border-top: 0; }
    .data-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 9px;
    }
    .data-heading p {
      margin: 0;
      color: var(--text-faint);
      font-size: .76rem;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface-solid);
      scrollbar-width: thin;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .79rem;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-soft);
      color: var(--text-soft);
      font-size: .67rem;
      font-weight: 780;
      letter-spacing: .045em;
      text-transform: uppercase;
    }
    tbody tr:hover { background: color-mix(in srgb, var(--brand) 3.5%, transparent); }
    .group-row td {
      background: color-mix(in srgb, var(--brand) 4%, var(--surface-solid));
      font-weight: 770;
    }
    .sub-row td:first-child { padding-left: 28px; color: var(--text-soft); }
    .missing { color: var(--text-faint); font-style: italic; font-weight: 450; }
    .number-strong { color: var(--text); font-weight: 750; }
    .mono { font-family: var(--mono); }

    .binary-grid, .throughput-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .binary-card, .throughput-card {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
    }
    .binary-top, .throughput-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }
    .binary-top strong, .throughput-card strong { font-variant-numeric: tabular-nums; }
    .binary-top span, .throughput-card span {
      color: var(--text-faint);
      font-size: .72rem;
    }
    .meter {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--border);
    }
    .meter > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }
    .binary-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: var(--text-soft);
      font-size: .69rem;
    }

    .depth-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .depth-summary div {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .depth-summary span {
      display: block;
      color: var(--text-faint);
      font-size: .65rem;
      font-weight: 730;
      text-transform: uppercase;
    }
    .depth-summary strong { display: block; margin-top: 2px; font-size: .9rem; }
    .mini-bar-track {
      width: 110px;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--border);
    }
    .mini-bar-track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--brand);
    }
    .caption {
      margin: 9px 1px 0;
      color: var(--text-faint);
      font-size: .73rem;
    }

    .throughput-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .throughput-card { min-width: 0; }
    .throughput-card strong {
      display: block;
      margin: 3px 0 5px;
      overflow-wrap: anywhere;
      font-size: 1.1rem;
    }
    .metric-source { padding: 3px 7px; font-size: .62rem; }
    .callout { margin-top: 11px; }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .recent-card {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
    }
    .recent-card.error { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
    .recent-card .archive-name { min-height: auto; margin: 6px 0; }
    .recent-meta { color: var(--text-faint); font-size: .71rem; }
    .error-summary {
      margin: 7px 0 0;
      color: var(--danger);
      font-size: .76rem;
      overflow-wrap: anywhere;
    }

    .cost-card {
      position: sticky;
      top: 12px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--brand) 24%, var(--border));
      border-radius: var(--radius);
      background:
        linear-gradient(155deg, color-mix(in srgb, var(--surface-raised) 93%, var(--brand) 7%), var(--surface-solid));
      box-shadow: var(--shadow);
    }
    .cost-inner { padding: 21px; }
    .cost-total {
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1d4ed8, #0f8f83);
      color: #fff;
    }
    .cost-total span {
      display: block;
      font-size: .69rem;
      font-weight: 760;
      letter-spacing: .07em;
      opacity: .82;
      text-transform: uppercase;
    }
    .cost-total strong {
      display: block;
      margin-top: 3px;
      font-size: 1.75rem;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .cost-group {
      padding: 15px 0 2px;
      border-bottom: 1px solid var(--border);
    }
    .cost-group:last-of-type { border-bottom: 0; }
    .cost-group h3 {
      margin-bottom: 8px;
      color: var(--brand);
      font-size: .77rem;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
    .kv {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0;
      color: var(--text-soft);
      font-size: .76rem;
    }
    .kv strong {
      max-width: 62%;
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .vm-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .vm-card {
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
    }
    .vm-card h3 {
      margin: 0 0 6px;
      font-size: .95rem;
      font-family: var(--mono);
    }
    .vm-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin: 0 0 10px;
      color: var(--text-soft);
      font-size: .74rem;
    }
    .vm-workers {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .vm-worker-row {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-raised);
      font-size: .78rem;
    }
    .vm-worker-row strong { font-family: var(--mono); }

    .estimate-note {
      margin: 14px 0 0;
      padding: 10px 11px;
      border-radius: 10px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: .7rem;
    }

    .poll-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
      color: var(--text-faint);
      font-size: .72rem;
    }
    .poll-state { display: inline-flex; align-items: center; gap: 6px; }
    .poll-state::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
    }
    .poll-state.retrying::before, .poll-state.fallback::before { background: var(--warn); }
    footer {
      padding: 7px 2px 0;
      color: var(--text-faint);
      font-size: .73rem;
      text-align: center;
    }
    .loading {
      display: grid;
      min-height: 420px;
      place-items: center;
      color: var(--text-soft);
    }
    .loading-box {
      padding: 22px 26px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      text-align: center;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 10px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1160px) {
      .page-grid { grid-template-columns: minmax(0, 1fr) 310px; }
      .throughput-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .page-grid { display: flex; flex-direction: column; }
      .main-column { width: 100%; order: 2; }
      .cost-card { position: static; width: 100%; order: 1; }
      .cost-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
      .cost-heading, .cost-total, .estimate-note { grid-column: 1 / -1; }
      .worker-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 650px) {
      .shell { width: min(100% - 20px, 1540px); padding-top: 10px; }
      .hero, .panel { border-radius: 17px; }
      .hero-top { display: block; }
      .status-badge { margin-top: 17px; }
      .hero-stats, .scope-grid, .binary-grid, .depth-summary, .throughput-grid, .recent-grid {
        grid-template-columns: 1fr 1fr;
      }
      .cost-inner { display: block; }
      .tabs { top: 4px; margin-left: -4px; margin-right: -4px; }
      .tab { padding: 8px 5px; font-size: .8rem; }
      .scope-heading { align-items: flex-start; }
      .section-heading, .data-heading { display: block; }
      .section-kicker, .data-heading p { margin-top: 4px; }
      .mini-bar-track { width: 70px; }
    }
    @media (max-width: 420px) {
      .hero-stats, .scope-grid, .binary-grid, .depth-summary, .throughput-grid, .recent-grid {
        grid-template-columns: 1fr;
      }
      .worker-details { grid-template-columns: 1fr; }
      .progress-caption { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to extraction metrics</a>
  <div id="app" aria-live="polite">
    <div class="loading">
      <div class="loading-box">
        <div class="spinner" aria-hidden="true"></div>
        <strong>Loading GCP extraction status</strong>
        <div>Reading the latest cloud snapshot…</div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    // Prefer publisher-owned status-full.json (workers race on status.json).
    const LIVE_STATUS_FULL_URL = "https://cad-extract-status-874846752452.s3.ap-south-1.amazonaws.com/status-full.json";
    const LIVE_STATUS_URL = "https://cad-extract-status-874846752452.s3.ap-south-1.amazonaws.com/status.json";
    const FALLBACK_GITHUB_STATUS_URL = "https://raw.githubusercontent.com/dhigdec/cad-extract-status/main/status.json";
    const FALLBACK_GCS_STATUS_URL = "https://storage.googleapis.com/cad-extract-public-status-mlproject-501205/status.json";
    const FALLBACK_STATUS_URL = FALLBACK_GITHUB_STATUS_URL;
    const POLL_MS = 20000;
    const STALL_AFTER_SECONDS = 120;
    const SCOPE_DEFS = [
      { id: "disk1", label: "Disk 1", short: "D1", diskKey: "Disk-1", aliases: ["Disk-1", "Disk 1", "disk1", "disk_1", "d1"] },
      { id: "disk2", label: "Disk 2", short: "D2", diskKey: "Disk-2", aliases: ["Disk-2", "Disk 2", "disk2", "disk_2", "d2"] },
      { id: "combined", label: "Combined", short: "Σ", diskKey: "combined", aliases: ["combined", "all", "overall", "total", "totals"] }
    ];
    const CATEGORY_ALIASES = {
      pdf: ["pdf", "pdfs", "all_pdf", "all_pdfs"],
      cad_pdf: ["cad_pdf", "cad_pdfs", "cadpdf", "drawing_pdf", "drawing_pdfs"],
      other_pdf: ["other_pdf", "other_pdfs", "non_cad_pdf", "noncad_pdf", "non_cad_pdfs"],
      "2d": ["2d", "cad_2d", "two_d", "drawings_2d"],
      "3d": ["3d", "cad_3d", "three_d", "models_3d"],
      nc1: ["nc1", ".nc1", "nc_1"]
    };
    const VARIANT_ALIASES = {
      raw: ["raw", "total", "observations", "files", "count"],
      weak: ["weak", "weak_distinct", "weak_unique", "name_size_distinct", "distinct_name_size"],
      sha256: ["sha256", "sha", "sha_distinct", "sha256_distinct", "distinct_sha"]
    };
    const PDF_CLASSES = [
      ["shop", "Shop"],
      ["detail", "Detail"],
      ["gather", "Gather"],
      ["erection", "Erection"],
      ["construction", "Construction"],
      ["abm", "ABM"],
      ["approval", "Approval"],
      ["inputs", "Inputs"],
      ["other", "Other"]
    ];
    const EXTENSIONS_2D = [".dxf", ".dwg", ".dg", ".dpm"];
    const EXTENSIONS_3D = [".stp", ".step", ".ifc", ".db1", ".sat", ".obj", ".stl", ".gltf", ".glb"];

    let latestStatus = null;
    let selectedScope = "combined";
    let lastPayload = "";
    let lastFetchAt = null;
    let pollError = null;
    let statusSource = null;

    const app = document.getElementById("app");
    const isObject = value => value !== null && typeof value === "object" && !Array.isArray(value);
    const present = value => value !== null && value !== undefined && value !== "";
    const number = value => {
      if (!present(value)) return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const normalize = value => String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, "");

    function aliasValue(object, aliases) {
      if (!isObject(object)) return undefined;
      for (const key of aliases) {
        if (Object.prototype.hasOwnProperty.call(object, key) && present(object[key])) return object[key];
      }
      const normalized = new Map(Object.keys(object).map(key => [normalize(key), key]));
      for (const key of aliases) {
        const actual = normalized.get(normalize(key));
        if (actual !== undefined && present(object[actual])) return object[actual];
      }
      return undefined;
    }

    function valueAt(object, path) {
      const parts = Array.isArray(path) ? path : String(path).split(".");
      let value = object;
      for (const part of parts) {
        if (!isObject(value) || !Object.prototype.hasOwnProperty.call(value, part)) return undefined;
        value = value[part];
      }
      return value;
    }

    function pickPath(object, paths) {
      for (const path of paths) {
        const value = valueAt(object, path);
        if (present(value)) return value;
      }
      return undefined;
    }

    function uniqueObjects(values) {
      return [...new Set(values.filter(isObject))];
    }

    function scopeDef(scopeId) {
      return SCOPE_DEFS.find(scope => scope.id === scopeId) || SCOPE_DEFS[2];
    }

    function scopedValue(container, scopeId) {
      const definition = scopeDef(scopeId);
      if (Array.isArray(container)) {
        return container.find(row => {
          const label = isObject(row) ? aliasValue(row, ["disk", "scope", "name", "id"]) : null;
          return definition.aliases.some(candidate => normalize(candidate) === normalize(label));
        });
      }
      if (!isObject(container)) return undefined;
      return aliasValue(container, definition.aliases);
    }

    function flatCountsToNodes(flat) {
      if (!isObject(flat)) return null;
      const counts = {};
      for (const [key, value] of Object.entries(flat)) {
        if (key === "note" || key === "label") continue;
        if (number(value) !== null) counts[key] = { raw: number(value) };
        else if (isObject(value) && (present(value.raw) || present(value.sha256) || present(value.weak))) {
          counts[key] = value;
        }
      }
      if (!Object.keys(counts).length) return null;
      if (counts.cad_pdf || counts.other_pdf) {
        counts.pdf_cad_binary = {
          cad_pdf: counts.cad_pdf || { raw: null },
          other_pdf: counts.other_pdf || { raw: null }
        };
      }
      return counts;
    }

    function sumFlatCounts(parts) {
      const out = {};
      for (const part of parts) {
        if (!isObject(part)) continue;
        for (const [key, value] of Object.entries(part)) {
          if (key === "note" || key === "label") continue;
          const n = number(value);
          if (n === null) continue;
          out[key] = (out[key] || 0) + n;
        }
      }
      return out;
    }

    // Project AWS fleet payloads (ec2_counts_delta / archives) into disks.* so existing
    // Disk 1 / Disk 2 / Combined count tables bind without pending placeholders.
    function statusHasAssetExtensions(status) {
      const counts = (((status || {}).disks || {}).combined || {}).counts
        || (((status || {}).counts || {}).combined)
        || (status || {}).cloud_counts
        || {};
      const byExt = (((counts["2d"] || {}).by_ext) || {});
      return isObject(byExt) && Object.keys(byExt).length > 0;
    }

    function countsNodeIsRich(node) {
      if (!isObject(node)) return false;
      if (present(node.weak) || present(node.sha256)) return true;
      if (isObject(node.by_ext)) {
        for (const child of Object.values(node.by_ext)) {
          if (isObject(child) && (present(child.weak) || present(child.sha256))) return true;
        }
      }
      return false;
    }

    function statusHasIdentityMetrics(status) {
      const counts = (((status || {}).disks || {}).combined || {}).counts
        || (((status || {}).counts || {}).combined)
        || (status || {}).cloud_counts
        || {};
      return countsNodeIsRich(counts["2d"]) || countsNodeIsRich(counts.pdf);
    }

    function mergeIdentityCounts(live, sticky) {
      if (!isObject(live) || !isObject(sticky)) return live;
      const next = live;
      if (isObject(sticky.disks)) {
        if (!isObject(next.disks)) next.disks = {};
        for (const disk of Object.keys(sticky.disks)) {
          const src = sticky.disks[disk];
          if (!isObject(src) || !isObject(src.counts)) continue;
          if (!isObject(next.disks[disk])) next.disks[disk] = {};
          const liveTwoD = (next.disks[disk].counts || {})["2d"];
          if (!countsNodeIsRich(liveTwoD) && countsNodeIsRich(src.counts["2d"])) {
            next.disks[disk].counts = src.counts;
          }
        }
      }
      if (isObject(sticky.counts)) {
        if (!isObject(next.counts)) next.counts = {};
        for (const disk of Object.keys(sticky.counts)) {
          const src = sticky.counts[disk];
          if (!isObject(src)) continue;
          if (!countsNodeIsRich((next.counts[disk] || {})["2d"]) && countsNodeIsRich(src["2d"])) {
            next.counts[disk] = src;
          }
        }
      }
      if (isObject(sticky.cloud_counts)
          && !countsNodeIsRich((next.cloud_counts || {})["2d"])
          && countsNodeIsRich(sticky.cloud_counts["2d"])) {
        next.cloud_counts = sticky.cloud_counts;
      }
      if (isObject(sticky.dedup)) next.dedup = sticky.dedup;
      if (isObject(sticky.pending_reasons)) next.pending_reasons = sticky.pending_reasons;
      return next;
    }

    function normalizeStatus(status) {
      if (!isObject(status)) return status;
      const next = status;
      if (!isObject(next.disks)) next.disks = {};

      const delta = next.ec2_counts_delta;
      if (isObject(delta)) {
        for (const diskName of ["Disk-1", "Disk-2"]) {
          const flat = delta[diskName];
          const nodes = flatCountsToNodes(flat);
          if (!nodes) continue;
          if (!isObject(next.disks[diskName])) next.disks[diskName] = {};
          // Prefer richer disks.*.counts if already present; otherwise use delta.
          // Thin writers may leave counts with raw-only / sha256:null — treat as missing.
          const existing = next.disks[diskName].counts;
          if (!isObject(existing) || !countsNodeIsRich(existing["2d"] || existing.pdf)) {
            next.disks[diskName].counts = nodes;
          }
        }
        if (!isObject(next.disks.combined)) next.disks.combined = {};
        if (!isObject(next.disks.combined.counts) || !countsNodeIsRich((next.disks.combined.counts || {})["2d"])) {
          const combinedFlat = isObject(delta.combined)
            ? delta.combined
            : sumFlatCounts([delta["Disk-1"], delta["Disk-2"]]);
          const nodes = flatCountsToNodes(combinedFlat);
          if (nodes && !countsNodeIsRich((next.disks.combined.counts || {})["2d"])) {
            next.disks.combined.counts = nodes;
          }
        }
        if (!isObject(next.counts)) {
          const combinedFlat = isObject(delta.combined)
            ? delta.combined
            : sumFlatCounts([delta["Disk-1"], delta["Disk-2"]]);
          next.counts = flatCountsToNodes(combinedFlat) || next.counts;
        }
      }

      if (isObject(next.archives)) {
        for (const diskName of ["Disk-1", "Disk-2", "combined"]) {
          const arch = next.archives[diskName];
          if (!isObject(arch)) continue;
          if (!isObject(next.disks[diskName])) next.disks[diskName] = {};
          if (!isObject(next.disks[diskName].archives)) next.disks[diskName].archives = arch;
        }
      }

      // Promote fleet.workers_alive for older header helpers.
      if (!present(next.workers_alive) && isObject(next.fleet) && present(next.fleet.workers_alive)) {
        next.workers_alive = next.fleet.workers_alive;
        next.cloud_workers_alive = next.fleet.workers_alive;
      }
      if (!present(next.workers_configured) && isObject(next.fleet) && present(next.fleet.workers_configured)) {
        next.workers_configured = next.fleet.workers_configured;
      }
      return next;
    }

    function collectScopeRoots(status, scopeId) {
      const roots = [];
      const containers = [
        status.disks, status.by_disk, status.byDisk, status.per_disk, status.perDisk,
        status.disk_stats, status.diskStats, status.scopes, status.datasets,
        status.ec2_counts_delta
      ];
      for (const container of containers) {
        const scoped = scopedValue(container, scopeId);
        if (isObject(scoped)) roots.push(scoped);
      }
      const direct = scopedValue(status, scopeId);
      if (isObject(direct)) roots.push(direct);
      if (scopeId === "combined") {
        for (const key of ["combined", "overall", "summary"]) {
          if (isObject(status[key])) roots.push(status[key]);
        }
        roots.push(status);
      }
      return uniqueObjects(roots);
    }

    function addObject(target, value) {
      if (isObject(value)) target.push(value);
    }

    function addScopedObject(target, container, scopeId) {
      const scoped = scopedValue(container, scopeId);
      if (isObject(scoped)) target.push(scoped);
    }

    function addArray(target, value) {
      if (Array.isArray(value)) target.push(value);
    }

    function addScopedArray(target, container, scopeId) {
      const scoped = scopedValue(container, scopeId);
      if (Array.isArray(scoped)) target.push(scoped);
    }

    function diskKeyForScope(scopeId) {
      const definition = scopeDef(scopeId);
      return definition.diskKey || (scopeId === "disk1" ? "Disk-1" : scopeId === "disk2" ? "Disk-2" : "combined");
    }

    function explicitDiskNode(status, scopeId) {
      const key = diskKeyForScope(scopeId);
      const disks = isObject(status.disks) ? status.disks : {};
      if (isObject(disks[key])) return disks[key];
      return undefined;
    }

    function buildBundle(status, scopeId) {
      const roots = collectScopeRoots(status, scopeId);
      const archiveRoots = [];
      const countRoots = [];
      const depthRoots = [];
      const storageRoots = [];
      const backlogArrays = [];

      // Prefer explicit disks.<Disk-N|combined>.{archives,counts} so every tab
      // binds the same schema the AWS publisher writes.
      const explicit = explicitDiskNode(status, scopeId);
      if (isObject(explicit)) {
        addObject(archiveRoots, explicit.archives);
        addObject(countRoots, explicit.counts);
        addObject(roots, explicit);
      }
      const scopedCounts = isObject(status.counts) ? scopedValue(status.counts, scopeId) : undefined;
      addObject(countRoots, scopedCounts);
      if (scopeId === "combined") {
        addObject(countRoots, status.cloud_counts);
      }

      for (const root of roots) {
        archiveRoots.push(root);
        countRoots.push(root);
        storageRoots.push(root);
        for (const key of ["archives", "archive", "archive_counts", "archiveCounts", "progress"]) {
          addObject(archiveRoots, root[key]);
        }
        for (const key of ["counts", "assets", "file_counts", "fileCounts", "totals"]) {
          addObject(countRoots, root[key]);
        }
        for (const key of ["nested_depth", "nestedDepth", "depth", "depths"]) {
          addObject(depthRoots, root[key]);
        }
        for (const key of ["storage", "transfer", "bytes", "gcs"]) {
          addObject(storageRoots, root[key]);
        }
        for (const key of ["remaining_by_size", "remainingBySize", "backlog_by_size", "backlogBySize"]) {
          addArray(backlogArrays, root[key]);
        }
      }

      for (const container of [status.archives, status.archive, status.archive_counts, status.progress]) {
        addScopedObject(archiveRoots, container, scopeId);
      }
      for (const container of [status.counts, status.cloud_counts, status.file_counts, status.assets, status.ec2_counts_delta]) {
        addScopedObject(countRoots, container, scopeId);
      }
      for (const container of [status.nested_depth, status.cloud_depth, status.depth, status.depths]) {
        addScopedObject(depthRoots, container, scopeId);
      }
      for (const container of [status.storage, status.transfers, status.gcs, status.aws_source]) {
        addScopedObject(storageRoots, container, scopeId);
      }
      for (const container of [status.remaining_by_size, status.backlog_by_size, status.backlog]) {
        addScopedArray(backlogArrays, container, scopeId);
      }

      if (scopeId === "combined") {
        addObject(archiveRoots, status.archives_combined);
        addObject(archiveRoots, status.progress);
        addObject(countRoots, status.cloud_counts);
        addObject(countRoots, status.counts);
        // Only project flat EC2 deltas when richer disks/cloud counts are absent.
        const hasRichCombined = countRootRichness(status.cloud_counts) > 0
          || countRootRichness((status.disks && status.disks.combined && status.disks.combined.counts) || null) > 0
          || countRootRichness((status.counts && status.counts.combined) || null) > 0;
        if (!hasRichCombined && isObject(status.ec2_counts_delta)) {
          const combinedFlat = isObject(status.ec2_counts_delta.combined)
            ? status.ec2_counts_delta.combined
            : sumFlatCounts([status.ec2_counts_delta["Disk-1"], status.ec2_counts_delta["Disk-2"]]);
          const nodes = flatCountsToNodes(combinedFlat);
          if (nodes) addObject(countRoots, nodes);
        }
        addObject(depthRoots, status.cloud_depth);
        addObject(depthRoots, status.nested_depth);
        addObject(storageRoots, status.gcs);
        addObject(storageRoots, status.aws_source);
        addArray(backlogArrays, status.remaining_by_size);
      }

      return {
        id: scopeId,
        roots,
        archiveRoots: uniqueObjects(archiveRoots),
        countRoots: uniqueObjects(countRoots),
        depthRoots: uniqueObjects(depthRoots),
        storageRoots: uniqueObjects(storageRoots),
        backlogArrays
      };
    }

    function metricFromRoots(roots, aliases) {
      for (const root of roots) {
        const value = aliasValue(root, aliases);
        if (present(value) && !isObject(value) && !Array.isArray(value)) return value;
      }
      return undefined;
    }

    function archiveMetric(bundle, metric) {
      const aliases = {
        total: ["total", "archives_total", "archive_total", "manifest_total", "total_archives"],
        done: ["done", "completed_ok", "archives_done", "archive_done", "finished", "successful"],
        remaining: ["remaining", "archives_remaining", "archive_remaining", "left"],
        failed: ["failed", "failures", "error", "errors", "failed_active_checkpoints"],
        retried: ["retried", "retries", "retry_count", "archives_retried"],
        skipped: ["skipped", "skipped_too_large", "skip_count", "archives_skipped"],
        doneOnGcp: ["done_on_gcp", "completed_on_gcp", "gcp_done"],
        doneBeforeGcp: [
          "done_local_before_cutover", "done_before_gcp", "pre_gcp_done", "baseline_completed_ok"
        ]
      };
      return metricFromRoots(bundle.archiveRoots, aliases[metric] || [metric]);
    }

    function categoryNodes(root, category) {
      const aliases = CATEGORY_ALIASES[category] || [category];
      const bases = [root];
      for (const key of ["categories", "assets", "files", "file_counts", "fileCounts", "totals"]) {
        const child = aliasValue(root, [key]);
        if (isObject(child)) bases.push(child);
      }
      const nodes = [];
      for (const base of bases) {
        const direct = aliasValue(base, aliases);
        if (present(direct)) nodes.push(direct);
        if (category === "cad_pdf" || category === "other_pdf") {
          const binary = aliasValue(base, ["pdf_cad_binary", "pdf_binary", "cad_binary", "pdf_classification"]);
          const nested = aliasValue(binary, aliases);
          if (present(nested)) nodes.push(nested);
        }
      }
      return nodes;
    }

    function countRootRichness(root) {
      if (!isObject(root)) return 0;
      let score = 0;
      for (const key of ["2d", "3d", "nc1", "pdf"]) {
        const node = root[key];
        if (!isObject(node)) continue;
        if (present(node.weak) || present(node.sha256)) score += 4;
        if (isObject(node.by_ext) && Object.keys(node.by_ext).length) score += 8;
        if (present(node.raw)) score += 1;
      }
      if (isObject(root.by_ext) && Object.keys(root.by_ext).length) score += 8;
      return score;
    }

    function orderedCountRoots(bundle) {
      return [...bundle.countRoots].sort((a, b) => countRootRichness(b) - countRootRichness(a));
    }

    function countValue(bundle, category, variant) {
      const categoryAliases = CATEGORY_ALIASES[category] || [category];
      const variantAliases = VARIANT_ALIASES[variant] || [variant];
      let fallback;
      for (const root of orderedCountRoots(bundle)) {
        for (const node of categoryNodes(root, category)) {
          if (!isObject(node) && variant === "raw" && number(node) !== null) {
            if (fallback === undefined) fallback = node;
            continue;
          }
          const value = aliasValue(node, variantAliases);
          if (present(value) && !isObject(value)) {
            // Prefer category nodes that also carry identity metrics / extensions.
            if (variant === "raw" && isObject(node) && !(present(node.weak) || present(node.sha256) || isObject(node.by_ext))) {
              if (fallback === undefined) fallback = value;
              continue;
            }
            return value;
          }
        }
        const bases = [root];
        for (const key of ["categories", "assets", "files", "file_counts", "fileCounts", "totals"]) {
          const child = aliasValue(root, [key]);
          if (isObject(child)) bases.push(child);
        }
        for (const base of bases) {
          const variantNode = aliasValue(base, variantAliases);
          if (isObject(variantNode)) {
            const value = aliasValue(variantNode, categoryAliases);
            if (present(value) && !isObject(value)) return value;
          }
        }
      }
      return fallback;
    }

    function extensionValue(bundle, family, extension, variant) {
      const variantAliases = VARIANT_ALIASES[variant] || [variant];
      const extensionAliases = [extension, extension.replace(".", "")];
      for (const root of orderedCountRoots(bundle)) {
        const bases = [root];
        for (const key of ["categories", "assets", "files", "file_counts", "fileCounts", "counts"]) {
          const child = aliasValue(root, [key]);
          if (isObject(child)) bases.push(child);
        }
        for (const base of bases) {
          const familyNode = aliasValue(base, CATEGORY_ALIASES[family]);
          if (isObject(familyNode)) {
            const extensions = aliasValue(familyNode, ["by_ext", "by_extension", "extensions", "extension_breakdown"]);
            const extensionNode = aliasValue(extensions, extensionAliases);
            const value = aliasValue(extensionNode, variantAliases);
            if (present(value) && !isObject(value)) return value;
          }
          const extensions = aliasValue(base, ["by_ext", "by_extension", "extensions", "extension_breakdown"]);
          const extensionNode = aliasValue(extensions, extensionAliases);
          if (isObject(extensionNode)) {
            const familyNode = aliasValue(extensionNode, CATEGORY_ALIASES[family]);
            const value = aliasValue(isObject(familyNode) ? familyNode : extensionNode, variantAliases);
            if (present(value) && !isObject(value)) return value;
          }
        }
      }
      return undefined;
    }

    function blockRoot(bundle) {
      const roots = [];
      for (const root of bundle.countRoots) {
        roots.push(root);
        addObject(roots, aliasValue(root, ["block", "blocks", "block_level", "block_dedup"]));
      }
      return uniqueObjects(roots);
    }

    function blockMetrics(bundle) {
      const roots = blockRoot(bundle);
      const distinctBlocks = metricFromRoots(roots, ["distinct_blocks", "distinct", "block_sha256", "sha256", "unique_blocks", "block_hashes"]);
      const totalBytes = metricFromRoots(roots, ["total_block_bytes", "block_bytes_total", "total_bytes"]);
      let uniqueBytes = metricFromRoots(roots, ["unique_block_bytes", "block_bytes_unique", "unique_bytes"]);
      const duplicateBytes = metricFromRoots(roots, ["duplicate_block_bytes", "block_bytes_duplicate", "duplicate_bytes"]);
      if (number(uniqueBytes) === null && number(totalBytes) !== null && number(duplicateBytes) !== null) {
        uniqueBytes = Math.max(0, number(totalBytes) - number(duplicateBytes));
      }
      let ratio = metricFromRoots(roots, ["dedup_ratio", "deduplication_ratio", "block_dedup_ratio"]);
      if (number(ratio) === null && number(totalBytes) !== null && number(uniqueBytes) > 0) {
        ratio = number(totalBytes) / number(uniqueBytes);
      }
      return { distinctBlocks, totalBytes, uniqueBytes, duplicateBytes, ratio };
    }

    function classificationValue(bundle, className, variant) {
      const variantAliases = VARIANT_ALIASES[variant] || [variant];
      const classAliases = [className, `${className}_pdf`, `${className}_drawings`];
      for (const root of bundle.countRoots) {
        const classification = aliasValue(root, [
          "pdf_by_drawing_type", "pdf_by_type", "pdf_classes", "pdf_classification", "pdf_categories"
        ]);
        const classNode = aliasValue(classification, classAliases);
        const value = aliasValue(classNode, variantAliases);
        if (present(value) && !isObject(value)) return value;
      }
      return undefined;
    }

    function distributionObject(bundle, aliases) {
      for (const root of bundle.depthRoots) {
        const value = aliasValue(root, aliases);
        if (isObject(value)) return value;
      }
      return null;
    }

    function depthMetric(bundle, aliases) {
      return metricFromRoots(bundle.depthRoots, aliases);
    }

    function mapMetric(container, mapAliases, scopeId) {
      if (!isObject(container)) return undefined;
      const map = aliasValue(container, mapAliases);
      if (!isObject(map)) return undefined;
      return scopedValue(map, scopeId);
    }

    function storageMetric(status, bundle, metric) {
      const aliases = {
        extractedBytes: ["extracted_bytes", "bytes_extracted", "uncompressed_bytes", "output_bytes"],
        transferredBytes: ["compressed_source_bytes_transferred", "source_bytes_transferred", "bytes_transferred", "compressed_bytes"],
        storedObjects: ["stored_object_count", "object_count", "objects", "uploaded_files", "stored_files"],
        storedBytes: ["stored_bytes", "bytes_stored", "uploaded_bytes", "gcs_bytes"]
      };
      const direct = metricFromRoots(bundle.storageRoots, aliases[metric]);
      if (present(direct)) return direct;

      const mapAliases = {
        extractedBytes: ["extracted_bytes_by_disk", "bytes_extracted_by_disk"],
        transferredBytes: ["bytes_transferred_by_disk", "source_bytes_by_disk", "compressed_bytes_by_disk"],
        storedObjects: ["object_count_by_disk", "stored_objects_by_disk", "uploaded_files_by_disk"],
        storedBytes: ["stored_bytes_by_disk", "bytes_stored_by_disk", "uploaded_bytes_by_disk"]
      };
      for (const container of [status.gcs, status.aws_source, status.storage, status.s3, status.transfers]) {
        const mapped = mapMetric(container, mapAliases[metric], bundle.id);
        if (present(mapped)) return mapped;
      }
      return undefined;
    }

    function heartbeatValue(status) {
      return pickPath(status, [
        "last_update_iso", "status_last_updated", "heartbeat_at", "updated_at_iso",
        ["heartbeat", "at"], ["status", "updated_at"]
      ]);
    }

    function heartbeatAgeSeconds(status) {
      const value = heartbeatValue(status);
      if (!present(value)) return null;
      const millis = typeof value === "number" ? value * 1000 : Date.parse(value);
      return Number.isFinite(millis) ? Math.max(0, (Date.now() - millis) / 1000) : null;
    }

    function ageTextFromSeconds(seconds) {
      if (number(seconds) === null) return "not available";
      if (seconds < 60) return `${Math.round(seconds)}s`;
      if (seconds < 7200) return `${(seconds / 60).toFixed(seconds < 600 ? 1 : 0)}m`;
      if (seconds < 172800) return `${(seconds / 3600).toFixed(1)}h`;
      return `${(seconds / 86400).toFixed(1)}d`;
    }

    function healthInfo(status) {
      const age = heartbeatAgeSeconds(status);
      const workerCount = number(pickPath(status, [
        "cloud_workers_alive", "workers_alive", ["fleet", "workers_alive"], ["workers", "alive_count"]
      ]));
      const declared = normalize(pickPath(status, ["health", "state"]));
      if (age !== null && age > STALL_AFTER_SECONDS) {
        return { key: "stalled", label: "STALLED", age };
      }
      if (age === null) {
        return { key: "waiting", label: "WAITING", age };
      }
      if (workerCount === 0 || ["stopped", "failed", "error", "stale"].includes(declared)) {
        return { key: "stalled", label: "STALLED", age };
      }
      return { key: "alive", label: "ALIVE", age };
    }

    const integerFormat = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
    const decimalFormat = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
    const rateFormat = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });

    function formatCount(value, missing = "pending") {
      const parsed = number(value);
      return parsed === null ? missing : integerFormat.format(parsed);
    }

    function formatDecimal(value, digits = 2, missing = "pending") {
      const parsed = number(value);
      if (parsed === null) return missing;
      return new Intl.NumberFormat(undefined, { maximumFractionDigits: digits }).format(parsed);
    }

    function formatBytes(value, missing = "pending") {
      const parsed = number(value);
      if (parsed === null) return missing;
      if (parsed === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB", "PB"];
      const index = Math.min(units.length - 1, Math.max(0, Math.floor(Math.log(Math.abs(parsed)) / Math.log(1000))));
      const scaled = parsed / (1000 ** index);
      return `${scaled.toLocaleString(undefined, { maximumFractionDigits: scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2 })} ${units[index]}`;
    }

    function formatMoney(value, missing = "pending") {
      const parsed = number(value);
      if (parsed === null) return missing;
      const digits = Math.abs(parsed) < .01 ? 4 : 2;
      return `$${parsed.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
    }

    function formatPercent(value, missing = "pending") {
      const parsed = number(value);
      return parsed === null ? missing : `${parsed.toFixed(1)}%`;
    }

    function formatRatio(value, missing = "pending") {
      const parsed = number(value);
      return parsed === null ? missing : `${parsed.toFixed(2)}×`;
    }

    function formatDurationSeconds(value, missing = "pending") {
      const seconds = number(value);
      if (seconds === null) return missing;
      if (seconds < 60) return `${Math.round(seconds)}s`;
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (!hours) return `${minutes}m ${Math.round(seconds % 60)}s`;
      return `${hours}h ${minutes}m`;
    }

    function formatTimestamp(value, missing = "not available") {
      if (!present(value)) return missing;
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return escapeHtml(value);
      return escapeHtml(new Intl.DateTimeFormat(undefined, {
        month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
        second: "2-digit", timeZoneName: "short"
      }).format(date));
    }

    function missing(value, formatter, fallback = "pending") {
      return number(value) === null
        ? `<span class="missing">${escapeHtml(fallback)}</span>`
        : formatter(value);
    }

    function basename(value) {
      if (!present(value)) return null;
      const clean = String(value).split(/[?#]/)[0].replace(/\\/g, "/");
      return clean.split("/").filter(Boolean).pop() || null;
    }

    function diskFromValue(value) {
      const match = String(value ?? "").match(/(?:^|[\\/])(disk[\s_-]*[12])(?:[\\/]|$)/i);
      if (!match) return null;
      return normalize(match[1]).endsWith("1") ? "Disk 1" : "Disk 2";
    }

    function safeError(value) {
      if (!present(value)) return null;
      let output = String(value).split(/\r?\n/)[0];
      output = output.replace(/\b(?:gs|s3):\/\/\S+/gi, "[object redacted]");
      output = output.replace(/(?:[A-Za-z]:)?(?:[\\/][^\\/\s:]+){2,}/g, "[path redacted]");
      output = output.replace(/\b(token|secret|password|api[_-]?key)\s*[:=]\s*\S+/gi, "$1=[redacted]");
      return output.slice(0, 220);
    }

    function workerArray(status) {
      for (const value of [status.current, status.workers, status.worker_activity, status.workerActivity]) {
        if (Array.isArray(value)) return value.filter(isObject);
      }
      return [];
    }

    function normalizedStage(value) {
      if (!present(value)) return "pending";
      const normalized = normalize(value);
      for (const stage of ["download", "extract", "hash", "upload", "checkpoint"]) {
        if (normalized.includes(stage)) return stage;
      }
      return String(value);
    }

    function workerElapsed(worker) {
      const explicit = aliasValue(worker, ["elapsed_seconds", "elapsed_s", "stage_elapsed_seconds", "elapsed"]);
      if (number(explicit) !== null) return explicit;
      const started = aliasValue(worker, ["started_at", "stage_started_at", "archive_started_at"]);
      const millis = Date.parse(started);
      return Number.isFinite(millis) ? Math.max(0, (Date.now() - millis) / 1000) : undefined;
    }

    function fleetCostEstimates(status) {
      const costEstimate = isObject(status.cost_estimate) ? status.cost_estimate : {};
      const costs = isObject(status.costs) ? status.costs : {};
      const compute = isObject(status.compute) ? status.compute : {};
      let hourly = number(aliasValue(costEstimate, ["hourly_ec2_plus_ebs_usd"]))
        ?? number(aliasValue(costs, ["combined_hourly_compute_disk_usd", "hourly_compute_disk_usd"]));
      let accrued = number(aliasValue(costEstimate, ["accrued_ec2_plus_ebs_usd"]))
        ?? number(aliasValue(costs, ["combined_accrued_estimate_usd", "accrued_estimate_usd"]));
      let uptimeHours = number(aliasValue(costEstimate, ["uptime_hours"]))
        ?? number(aliasValue(compute, ["uptime_hours"]));
      const fleetStart = Date.parse(
        aliasValue(costEstimate, ["fleet_start_utc"]) || aliasValue(compute, ["fleet_start_utc"]) || "2026-09-22T06:49:33Z"
      );
      if (!Number.isFinite(uptimeHours) && Number.isFinite(fleetStart)) {
        uptimeHours = Math.max(0, (Date.now() - fleetStart) / 3600000);
      }
      if (hourly === null) {
        const fleet = isObject(status.fleet) ? status.fleet : {};
        if (Array.isArray(fleet.instances)) {
          hourly = fleet.instances.reduce((sum, inst) => {
            if (!isObject(inst)) return sum;
            return sum + (number(inst.compute_hourly_estimate_usd) || 0) + (number(inst.ebs_hourly_estimate_usd) || 0);
          }, 0);
        }
      }
      if (accrued === null && hourly !== null && uptimeHours !== null) {
        accrued = hourly * uptimeHours;
      }
      return { hourly, accrued, uptimeHours };
    }

    function statusSourceLabel() {
      if (statusSource === "aws-s3") return "Live AWS S3";
      if (statusSource === "gcs-fallback") return "GCS fallback";
      if (statusSource === "github-fallback" || statusSource === "fallback") return "GitHub fallback";
      return "Live status";
    }

    function renderHeader(status) {
      const bundle = buildBundle(status, "combined");
      const total = archiveMetric(bundle, "total");
      const done = archiveMetric(bundle, "done");
      const remaining = archiveMetric(bundle, "remaining");
      const progress = number(total) > 0 && number(done) !== null
        ? Math.max(0, Math.min(100, number(done) / number(total) * 100))
        : null;
      const health = healthInfo(status);
      const gce = isObject(status.gce) ? status.gce : {};
      const workerCount = pickPath(status, [
        "cloud_workers_alive", "workers_alive", ["fleet", "workers_alive"],
        ["gce", "worker_count"], ["workers", "alive_count"]
      ]);
      const workersConfigured = pickPath(status, [
        "workers_configured", ["fleet", "workers_configured"]
      ]);
      const state = pickPath(status, [["gce", "state"], "state"]);
      const fleet = isObject(status.fleet) ? status.fleet : {};
      const instanceCount = number(fleet.instance_count) ?? (Array.isArray(fleet.instances) ? fleet.instances.length : null);
      const baselineDone = archiveMetric(bundle, "doneBeforeGcp") ?? pickPath(status, [
        ["archives", "combined", "baseline_completed_ok"],
        ["disks", "combined", "archives", "baseline_completed_ok"]
      ]);
      const ec2New = pickPath(status, [
        ["archives", "combined", "ec2_new_ok"],
        ["disks", "combined", "archives", "ec2_new_ok"]
      ]);
      const costHints = fleetCostEstimates(status);
      const hourly = costHints.hourly;
      const accrued = costHints.accrued;

      return `<header class="hero">
        <div class="hero-top">
          <div>
            <p class="eyebrow">Live public extraction status</p>
            <h1>Deep CAD extraction across Disk 1 &amp; Disk 2</h1>
            <p class="lede">A read-only view of the live AWS EC2 extraction fleet, archive progress, and estimated compute costs.</p>
          </div>
          <span id="status-badge" class="status-badge ${health.key}">${health.label}</span>
        </div>
        <div class="freshness-line">
          <span>Heartbeat <strong id="heartbeat-age">${escapeHtml(ageTextFromSeconds(health.age))} ago</strong></span>
          <span>Last update <strong>${formatTimestamp(heartbeatValue(status))}</strong></span>
          <span>Source <strong>${statusSourceLabel()}</strong></span>
          <span>Data pushed every ~20 seconds; page polls every 20 seconds</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Archive completion"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress === null ? 0 : progress.toFixed(1)}">
          <span style="width:${progress === null ? 0 : progress.toFixed(2)}%"></span>
        </div>
        <div class="progress-caption">
          <span><strong>${progress === null ? "Progress pending" : `${progress.toFixed(1)}% complete`}</strong></span>
          <span>${missing(done, formatCount)} of ${missing(total, formatCount)} archives</span>
        </div>
        <div class="hero-stats">
          <div class="hero-stat"><span>Archives done</span><strong>${missing(done, formatCount)}</strong>
            <small>${number(baselineDone) === null ? "baseline pending" : `${formatCount(baselineDone)} baseline + ${formatCount(ec2New)} EC2`}</small></div>
          <div class="hero-stat"><span>Total archives</span><strong>${missing(total, formatCount)}</strong>
            <small>${number(instanceCount) === null ? "fleet size pending" : `${formatCount(instanceCount)} EC2 instances`}</small></div>
          <div class="hero-stat"><span>Remaining</span><strong>${missing(remaining, formatCount)}</strong>
            <small>source archives</small></div>
          <div class="hero-stat"><span>Workers alive</span><strong>${missing(workerCount, formatCount)}</strong>
            <small>${number(workersConfigured) === null ? (present(state) ? escapeHtml(state) : "state pending") : `${formatCount(workersConfigured)} configured`}</small></div>
        </div>
        <div class="infra-line">
          <span class="chip">Platform · AWS EC2</span>
          <span class="chip">Region · ${escapeHtml(status.region || aliasValue(gce, ["region"]) || "ap-south-1")}</span>
          <span class="chip">Est. · ${formatMoney(hourly)}/hr · accrued ${formatMoney(accrued)}</span>
          <span class="chip">Feed · ${statusSourceLabel()}</span>
        </div>
      </header>`;
    }

    function vmEntries(status) {
      const vms = isObject(status.vms) ? status.vms : {};
      const entries = Object.entries(vms)
        .filter(([, value]) => isObject(value))
        .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true }));
      if (entries.length) return entries;

      const fleet = isObject(status.fleet) ? status.fleet : {};
      if (Array.isArray(fleet.instances)) {
        return fleet.instances
          .filter(isObject)
          .map(inst => {
            const name = aliasValue(inst, ["name", "instance_name", "id"]) || "instance";
            const workersObj = isObject(inst.workers) ? inst.workers : {};
            const workers = Object.entries(workersObj).map(([wid, meta]) => {
              const row = isObject(meta) ? { ...meta } : {};
              row.worker_id = row.worker_id || wid;
              row.instance_name = name;
              if (!present(row.current_archive) && present(row.current)) row.current_archive = row.current;
              if (!present(row.state)) row.state = row.alive === false ? "down" : "running";
              return row;
            });
            const hourly = (number(inst.compute_hourly_estimate_usd) || 0) + (number(inst.ebs_hourly_estimate_usd) || 0);
            const compute = isObject(status.compute) ? status.compute : {};
            const uptimeHours = number(compute.uptime_hours);
            const accrued = uptimeHours === null ? null : hourly * uptimeHours;
            return [name, {
              instance_name: name,
              machine_type: aliasValue(inst, ["type", "machine_type"]),
              type: aliasValue(inst, ["type", "machine_type"]),
              zone: aliasValue(inst, ["az", "zone"]),
              state: aliasValue(inst, ["state", "status"]) || "running",
              workers_alive: inst.workers_alive,
              workers_expected: inst.workers_configured,
              worker_count: inst.workers_configured,
              workers,
              costs: {
                hourly_compute_disk_estimate_usd: hourly || null,
                accrued_compute_disk_estimate_usd: accrued
              }
            }];
          })
          .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true }));
      }

      const workers = workerArray(status);
      if (!workers.length) return [];
      const byVm = new Map();
      for (const worker of workers) {
        const name = aliasValue(worker, ["instance_name", "vm", "host"]) || "workers";
        if (!byVm.has(name)) byVm.set(name, []);
        byVm.get(name).push(worker);
      }
      return [...byVm.entries()].map(([name, list]) => [name, {
        instance_name: name,
        workers: list,
        workers_alive: list.filter(w => aliasValue(w, ["alive"]) !== false).length,
        workers_expected: list.length,
        worker_count: list.length
      }]);
    }

    function renderWorkerRow(worker, index) {
      const archiveRaw = aliasValue(worker, [
        "archive_basename", "current_archive", "archive_label", "archive", "archive_path", "last_archive", "source"
      ]);
      const archiveName = basename(archiveRaw) || (present(archiveRaw) ? String(archiveRaw) : null);
      const disk = aliasValue(worker, ["disk", "source_disk", "dataset"]) || diskFromValue(archiveRaw);
      const workerId = aliasValue(worker, ["worker_id", "id", "shard", "worker", "index"]);
      const stage = normalizedStage(aliasValue(worker, ["stage", "state", "phase", "status"]));
      const sourceBytes = aliasValue(worker, [
        "compressed_bytes", "archive_bytes", "source_compressed_bytes", "compressed_size", "source_bytes"
      ]);
      const processed = aliasValue(worker, ["bytes_processed", "processed_bytes", "source_bytes_downloaded", "hashed_bytes", "uploaded_bytes"]);
      const elapsed = workerElapsed(worker);
      const alive = aliasValue(worker, ["alive"]) !== false;
      return `
            <article class="vm-worker-row${alive ? "" : " stalled"}">
              <div><strong>${present(workerId) ? escapeHtml(workerId) : `worker-${index + 1}`}</strong> · ${escapeHtml(stage)}${alive ? "" : " · down"}</div>
              <div>${archiveName ? escapeHtml(archiveName) : "<em>archive pending</em>"}</div>
              <div class="kv">
                <span>Disk</span><strong>${present(disk) ? escapeHtml(disk) : "n/a"}</strong>
                <span>Compressed</span><strong>${missing(sourceBytes, formatBytes)}</strong>
                <span>Elapsed</span><strong>${missing(elapsed, formatDurationSeconds)}</strong>
                <span>Processed</span><strong>${missing(processed, formatBytes)}</strong>
              </div>
            </article>`;
    }

    function renderWorkers(status) {
      const entries = vmEntries(status);
      const flatWorkers = workerArray(status);
      let cards = "";
      let reporting = 0;
      for (const [name, vm] of entries) {
        const workers = Array.isArray(vm.workers) ? vm.workers.filter(isObject) : flatWorkers.filter(w =>
          (aliasValue(w, ["instance_name", "vm", "host"]) || name) === name
        );
        reporting += workers.length;
        const alive = number(aliasValue(vm, ["workers_alive", "alive"])) ?? workers.filter(w => aliasValue(w, ["alive"]) !== false).length;
        const expected = number(aliasValue(vm, ["workers_expected", "worker_count", "expected"])) ?? workers.length;
        const costs = isObject(vm.costs) ? vm.costs : {};
        const hourly = aliasValue(costs, ["hourly_compute_disk_estimate_usd", "hourly_estimate_usd"]);
        const accrued = aliasValue(costs, ["accrued_compute_disk_estimate_usd", "accrued_estimate_usd"]);
        cards += `
          <section class="vm-card">
            <h3>${escapeHtml(aliasValue(vm, ["instance_name", "name"]) || name)}</h3>
            <div class="vm-meta">
              <span>${escapeHtml(aliasValue(vm, ["machine_type", "type"]) || "type n/a")}</span>
              <span>${escapeHtml(aliasValue(vm, ["zone"]) || "zone n/a")}</span>
              <span>${escapeHtml(aliasValue(vm, ["state", "status"]) || "state n/a")}</span>
              <span>workers ${formatCount(alive)} / ${formatCount(expected)}</span>
              <span>est. ${formatMoney(hourly)}/hr · accrued ${formatMoney(accrued)}</span>
            </div>
            <div class="vm-workers">
              ${workers.length ? workers.map((worker, index) => renderWorkerRow(worker, index)).join("") : "<em>No worker rows in feed yet</em>"}
            </div>
          </section>`;
      }
      if (!entries.length) {
        cards = `<p class="lede">Worker activity is not available in the current status schema.</p>`;
      }
      return `
        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Active fleet</p>
              <h2>VMs, workers & per-VM cost estimates</h2>
              <p class="lede">Every running VM with live worker rows. Archive names are basenames or safe hashes; paths are never published. Dollar figures are estimates only.</p>
            </div>
            <div class="freshness-line"><span>${formatCount(entries.length, "0")} VMs</span><span>${formatCount(reporting, "0")} worker rows</span></div>
          </div>
          <div class="vm-grid">${cards}</div>
        </section>`;
    }

    function archiveTable(bundle) {
      const rows = [
        ["Archives total", archiveMetric(bundle, "total")],
        ["Done", archiveMetric(bundle, "done")],
        ["Remaining", archiveMetric(bundle, "remaining")],
        ["Failed", archiveMetric(bundle, "failed")],
        ["Retried", archiveMetric(bundle, "retried")],
        ["Skipped", archiveMetric(bundle, "skipped")]
      ];
      return `<div class="table-wrap"><table>
        <thead><tr><th>Archive lifecycle</th><th>Count</th></tr></thead>
        <tbody>${rows.map(([label, value]) =>
          `<tr><td>${label}</td><td>${missing(value, formatCount)}</td></tr>`).join("")}</tbody>
      </table></div>`;
    }

    function assetRow(bundle, category, label, className = "") {
      return `<tr class="${className}"><td>${label}</td>
        <td>${missing(countValue(bundle, category, "raw"), formatCount)}</td>
        <td>${missing(countValue(bundle, category, "weak"), formatCount)}</td>
        <td>${missing(countValue(bundle, category, "sha256"), formatCount)}</td></tr>`;
    }

    function extensionRow(bundle, family, extension) {
      return `<tr class="sub-row"><td>${extension}</td>
        <td>${missing(extensionValue(bundle, family, extension, "raw"), formatCount)}</td>
        <td>${missing(extensionValue(bundle, family, extension, "weak"), formatCount)}</td>
        <td>${missing(extensionValue(bundle, family, extension, "sha256"), formatCount)}</td></tr>`;
    }

    function assetTable(bundle) {
      return `<div class="table-wrap"><table>
        <thead><tr><th>Extracted asset</th><th>Raw</th><th>Weak name + size</th><th>SHA-256 distinct</th></tr></thead>
        <tbody>
          ${assetRow(bundle, "pdf", "All PDFs")}
          ${assetRow(bundle, "cad_pdf", "CAD PDFs")}
          ${assetRow(bundle, "other_pdf", "Non-CAD PDFs")}
          ${assetRow(bundle, "2d", "2D total", "group-row")}
          ${EXTENSIONS_2D.map(extension => extensionRow(bundle, "2d", extension)).join("")}
          ${assetRow(bundle, "3d", "3D total", "group-row")}
          ${EXTENSIONS_3D.map(extension => extensionRow(bundle, "3d", extension)).join("")}
          ${assetRow(bundle, "nc1", "NC1")}
        </tbody>
      </table></div>`;
    }

    function blockTable(bundle) {
      const block = blockMetrics(bundle);
      return `<div class="table-wrap"><table>
        <thead><tr><th>Block-level deduplication</th><th>Value</th></tr></thead>
        <tbody>
          <tr><td>Distinct block hashes</td><td>${missing(block.distinctBlocks, formatCount)}</td></tr>
          <tr><td>Total block bytes</td><td>${missing(block.totalBytes, formatBytes)}</td></tr>
          <tr><td>Unique block bytes</td><td>${present(block.uniqueBytes) ? formatBytes(block.uniqueBytes) : (present(block.distinctBlocks) ? `${formatCount(block.distinctBlocks)} distinct hashes` : "not measured")}</td></tr>
          <tr><td>Duplicate block bytes</td><td>${present(block.duplicateBytes) ? formatBytes(block.duplicateBytes) : (present(block.distinctBlocks) ? `${formatCount(block.distinctBlocks)} distinct hashes` : "not measured")}</td></tr>
          <tr><td>Dedup ratio (total ÷ unique)</td><td>${missing(block.ratio, formatRatio)}</td></tr>
        </tbody>
      </table></div>`;
    }

    function transferTable(status, bundle) {
      const rows = [
        ["Extracted bytes", storageMetric(status, bundle, "extractedBytes")],
        ["Compressed source bytes transferred", storageMetric(status, bundle, "transferredBytes")],
        ["Stored object count", storageMetric(status, bundle, "storedObjects"), "count"],
        ["Stored object bytes", storageMetric(status, bundle, "storedBytes")]
      ];
      return `<div class="table-wrap"><table>
        <thead><tr><th>Transfer &amp; storage</th><th>Value</th></tr></thead>
        <tbody>${rows.map(([label, value, kind]) =>
          `<tr><td>${label}</td><td>${missing(value, kind === "count" ? formatCount : formatBytes)}</td></tr>`).join("")}</tbody>
      </table></div>`;
    }

    function percentage(part, other) {
      const a = number(part);
      const b = number(other);
      return a === null || b === null || a + b === 0 ? null : a / (a + b) * 100;
    }

    function binaryCard(label, raw, rawOther, sha, shaOther) {
      const rawPercent = percentage(raw, rawOther);
      const shaPercent = percentage(sha, shaOther);
      return `<div class="binary-card">
        <div class="binary-top"><strong>${label}</strong><span>${formatPercent(rawPercent)}</span></div>
        <div class="meter" aria-hidden="true"><span style="width:${number(rawPercent) === null ? 0 : rawPercent.toFixed(2)}%"></span></div>
        <div class="binary-meta"><span>Raw ${missing(raw, formatCount)}</span><span>SHA ${missing(sha, formatCount)} · ${formatPercent(shaPercent)}</span></div>
      </div>`;
    }

    function pdfSection(bundle) {
      const cadRaw = countValue(bundle, "cad_pdf", "raw");
      const otherRaw = countValue(bundle, "other_pdf", "raw");
      const cadSha = countValue(bundle, "cad_pdf", "sha256");
      const otherSha = countValue(bundle, "other_pdf", "sha256");
      const classRows = PDF_CLASSES.map(([key, label]) => `<tr><td>${label}</td>
        <td>${missing(classificationValue(bundle, key, "raw"), formatCount)}</td>
        <td>${missing(classificationValue(bundle, key, "sha256"), formatCount)}</td></tr>`).join("");

      return `<section class="data-section">
        <div class="data-heading"><div><h3>PDF classification</h3></div>
          <p>Raw observations vs byte-distinct SHA-256 files</p></div>
        <div class="binary-grid">
          ${binaryCard("CAD PDFs", cadRaw, otherRaw, cadSha, otherSha)}
          ${binaryCard("Non-CAD PDFs", otherRaw, cadRaw, otherSha, cadSha)}
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Drawing class</th><th>Raw</th><th>SHA-256 distinct</th></tr></thead>
          <tbody>${classRows}</tbody>
        </table></div>
        <p class="caption">Percentages use only the published CAD/non-CAD binary counts. Missing drawing classes are not inferred.</p>
      </section>`;
    }

    function depthValue(distribution, depth, supplied) {
      if (!supplied) return undefined;
      const value = aliasValue(distribution, [String(depth), depth]);
      return present(value) ? value : 0;
    }

    function depthSection(bundle) {
      const finished = distributionObject(bundle, [
        "finished_archive_max_depth_distribution", "finished_by_depth", "max_depth_distribution",
        "finished_depth_distribution", "depth_counts"
      ]);
      const nodes = distributionObject(bundle, ["archive_nodes_by_depth", "nodes_by_depth", "nested_nodes_by_depth"]);
      const finishedSupplied = isObject(finished) && Object.keys(finished).length > 0;
      const nodesSupplied = isObject(nodes) && Object.keys(nodes).length > 0;
      const measured = depthMetric(bundle, ["measured_finished_archives", "finished_archives_measured", "measured_archives"]);
      const unopened = depthMetric(bundle, ["unopened_archives_not_measured", "unopened_not_measured", "unmeasured_unopened"]);
      const cap = depthMetric(bundle, ["depth_cap", "max_depth_cap", "nesting_depth_cap"]);
      const capHits = depthMetric(bundle, ["depth_cap_hits", "cap_hits", "archives_hitting_depth_cap"]);
      let maximum = depthMetric(bundle, ["max_measured_depth", "maximum_measured_depth", "deepest"]);
      if (number(maximum) === null && finishedSupplied) {
        const observed = Object.entries(finished)
          .filter(([, value]) => number(value) > 0)
          .map(([key]) => number(key))
          .filter(value => value !== null);
        if (observed.length) maximum = Math.max(...observed);
      }
      const maxBucket = finishedSupplied
        ? Math.max(0, ...Array.from({ length: 16 }, (_, depth) => number(depthValue(finished, depth, true)) || 0))
        : 0;
      const rows = Array.from({ length: 16 }, (_, depth) => {
        const finishedCount = depthValue(finished, depth, finishedSupplied);
        const nodeCount = depthValue(nodes, depth, nodesSupplied);
        const width = maxBucket > 0 && number(finishedCount) !== null ? number(finishedCount) / maxBucket * 100 : 0;
        return `<tr><td>Depth ${depth}</td>
          <td>${missing(finishedCount, formatCount)}</td>
          <td>${missing(nodeCount, formatCount)}</td>
          <td><div class="mini-bar-track" aria-hidden="true"><span style="width:${width.toFixed(2)}%"></span></div></td></tr>`;
      }).join("");

      return `<section class="data-section">
