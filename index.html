<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deep CAD extraction</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:20px;color:#111;padding-right:370px}
    h1{font-size:1.3rem;margin:0 0 8px}h2{font-size:1rem;margin:22px 0 7px}
    .meta{color:#444}.alive{color:#087;font-weight:700}.stale{color:#c40;font-weight:700}
    table{border-collapse:collapse;width:auto;max-width:100%;margin-bottom:8px}
    th,td{border:1px solid #ccc;padding:5px 8px;text-align:right}
    th:first-child,td:first-child{text-align:left}th{background:#f3f3f3}
    .bar{height:20px;background:#e5e5e5;max-width:700px;margin-top:10px}
    .bar span{display:block;height:100%;background:#298f68}
    .mono{font-family:ui-monospace,monospace;font-size:.85rem;word-break:break-all}
    .card{position:fixed;right:12px;top:12px;width:330px;max-height:calc(100vh - 48px);
      overflow:auto;background:#111;color:#f5f5f5;padding:13px 15px;border-radius:9px;
      box-shadow:0 2px 12px #0005;font-size:13px;line-height:1.4}
    .card h2{margin:0 0 7px;color:#fff}.card .big{font-size:1.3rem;font-weight:700}
    .card .section{color:#8fd;font-weight:700;margin-top:10px}
    .kv{display:flex;justify-content:space-between;gap:10px}.kv b{text-align:right}
    .muted{color:#bbb;font-size:12px}.warning{color:#ffd37a;margin-top:8px}
    @media(max-width:900px){body{padding-right:0}.card{position:static;width:auto;margin-bottom:18px}}
  </style>
</head>
<body>
  <h1>Disk-1 / Disk-2 deep CAD extraction</h1>
  <div id="root">Loading…</div>
  <script>
    const fmt=x=>Number(x||0).toLocaleString();
    const money=x=>Number(x||0).toFixed(Math.abs(Number(x||0))<.01?4:2);
    const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const val=(o,...p)=>p.reduce((x,k)=>x&&x[k],o);

    function costCard(c){
      const gce=c.gce||{}, comp=c.compute||{}, disk=c.persistent_disk||{};
      const gcs=c.gcs||{}, aws=c.aws_source||{}, costs=c.costs||{};
      const accrued=(Number(comp.accrued_estimate_usd)||0)+(Number(disk.accrued_estimate_usd)||0)
        +(Number(aws.running_egress_estimate_usd)||0);
      return `<aside class="card">
        <h2>GCP pipeline cost estimates</h2>
        <div class="big">$${money(costs.combined_accrued_estimate_usd??accrued)}
          <span class="muted">current combined est.</span></div>
        <div class="section">GCE compute</div>
        <div class="kv"><span>Instance</span><b>${esc(gce.instance_name||"—")}</b></div>
        <div class="kv"><span>Type / zone</span><b>${esc(gce.machine_type||"—")} · ${esc(gce.zone||"—")}</b></div>
        <div class="kv"><span>State / workers</span><b>${esc(gce.state||c.state||"—")} · ${fmt(gce.worker_count)}</b></div>
        <div class="kv"><span>Rate</span><b>$${money(comp.hourly_estimate_usd)}/hour</b></div>
        <div class="kv"><span>Uptime / accrued</span><b>${Number(comp.uptime_hours||0).toFixed(2)}h · $${money(comp.accrued_estimate_usd)}</b></div>
        <div class="section">Persistent disk</div>
        <div class="kv"><span>Provisioned</span><b>${fmt(disk.size_gb)} GB ${esc(disk.type||"")}</b></div>
        <div class="kv"><span>Monthly / accrued</span><b>$${money(disk.monthly_estimate_usd)} · $${money(disk.accrued_estimate_usd)}</b></div>
        <div class="section">GCS Standard</div>
        <div class="kv"><span>Bucket</span><b>${esc(gcs.bucket||"—")}</b></div>
        <div class="kv"><span>Objects / stored</span><b>${fmt(gcs.object_count)} · ${Number(gcs.stored_gb||0).toFixed(3)} GB</b></div>
        <div class="kv"><span>Monthly storage</span><b>$${money(gcs.estimated_monthly_usd)}</b></div>
        <div class="section">AWS source transfer</div>
        <div class="kv"><span>Transferred</span><b>${Number(aws.gb_transferred||0).toFixed(3)} GB</b></div>
        <div class="kv"><span>One-time egress</span><b>$${money(aws.running_egress_estimate_usd)}</b></div>
        <div class="muted">At $${money(aws.egress_rate_usd_per_gb||.09)}/GB. Source transfer—not destination storage.</div>
        <div class="warning">All values are estimates, not cloud invoices.</div>
      </aside>`;
    }

    function render(st){
      const c=st.cloud||{}, p=st.archives_combined||{}, counts=st.cloud_counts||{};
      const raw=counts.raw||{}, weak=counts.weak||{}, sha=counts.sha256||{};
      const pct=p.total?100*Number(p.done||0)/Number(p.total):0;
      const workers=st.current||[], depth=st.cloud_depth||{};
      let h=costCard(c);
      h+=`<div class="meta">Status: <span class="${st.health==="alive"?"alive":"stale"}">${esc((st.health||"unknown").toUpperCase())}</span>
        · heartbeat ${st.age_seconds==null?"?":st.age_seconds+"s"} ago · source: GCS status.json</div>
        <div class="bar"><span style="width:${Math.min(100,pct).toFixed(2)}%"></span></div>
        <p>Archives <b>${fmt(p.done)} / ${fmt(p.total)}</b> (${pct.toFixed(1)}%) ·
        remaining ${fmt(p.remaining)} · active checkpoints ${fmt(p.failed)} · retries ${fmt(p.retries)} ·
        local done before cutover ${fmt(p.done_local_before_cutover)} · GCP done ${fmt(p.done_on_gcp)}</p>`;

      h+=`<h2>Four GCP archive workers</h2><table><tr><th>Worker</th><th>State</th><th>Current archive</th><th>Source size</th><th>Updated</th></tr>`;
      for(const w of workers) h+=`<tr><td>${fmt(w.shard)}</td><td>${esc(w.state)}</td>
        <td class="mono">${esc(w.current_archive||w.last_archive||"—")}</td>
        <td>${(Number(w.archive_bytes||0)/1e9).toFixed(3)} GB</td><td>${esc(w.updated_at||"—")}</td></tr>`;
      h+=`</table>`;

      h+=`<h2>GCP extracted asset counts</h2><table><tr><th>Category</th><th>Raw</th><th>Weak unique (name,size)</th><th>SHA-256 unique</th></tr>`;
      for(const [key,label] of [["cad_pdf","CAD PDF"],["other_pdf","Other PDF"],["2d","2D"],["3d","3D"],["nc1","NC1"]])
        h+=`<tr><td>${label}</td><td>${fmt(raw[key])}</td><td>${fmt(weak[key])}</td><td>${fmt(sha[key])}</td></tr>`;
      h+=`<tr><td>1 MiB blocks</td><td>—</td><td>—</td><td>${fmt(counts.block_sha256)}</td></tr></table>`;

      const nodes=depth.archive_nodes_by_depth||{}, maxima=depth.finished_archive_max_depth_distribution||{};
      const levels=[...new Set([...Object.keys(nodes),...Object.keys(maxima)])].map(Number).sort((a,b)=>a-b);
      h+=`<h2>Exact measured nested depth on GCP</h2>
        <p>Finished archives measured: ${fmt(depth.measured_finished_archives)} · unopened not measured: ${fmt(depth.unopened_archives_not_measured)} · safety cap: ${fmt(depth.depth_cap)}</p>
        <table><tr><th>Exact depth</th><th>Archive nodes opened</th><th>Finished archives with this maximum</th></tr>`;
      for(const d of levels) h+=`<tr><td>${d}</td><td>${fmt(nodes[d])}</td><td>${fmt(maxima[d])}</td></tr>`;
      if(!levels.length) h+=`<tr><td colspan="3">No GCP result finished yet.</td></tr>`;
      h+=`</table>`;

      const baseline=st.finished_depth_by_size||[];
      const baselineMax=Math.max(0,...baseline.flatMap(r=>Object.keys(r.depth_counts||{}).map(Number)));
      h+=`<h2>Exact pre-cutover depth by archive size</h2>
        <p>Preserved measurements from archives completed before the GCP cutover.</p>
        <table><tr><th>Archive size</th><th>Finished</th>`;
      for(let d=0;d<=baselineMax;d++)h+=`<th>Depth ${d}</th>`;
      h+=`<th>Deepest</th></tr>`;
      for(const r of baseline){h+=`<tr><td>${esc(r.label)}</td><td>${fmt(r.finished)}</td>`;
        for(let d=0;d<=baselineMax;d++)h+=`<td>${fmt((r.depth_counts||{})[d])}</td>`;
        h+=`<td>${r.deepest==null?"—":fmt(r.deepest)}</td></tr>`}
      h+=`</table><p class="muted">Public status refreshes from GCS about every 20 seconds.</p>`;
      document.getElementById("root").innerHTML=h;
    }
    async function tick(){try{const r=await fetch("status.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);render(await r.json())}
      catch(e){document.getElementById("root").innerHTML=`<p>Waiting for status: ${esc(e)}</p>`}}
    tick();setInterval(tick,5000);
  </script>
</body>
</html>
